let lastRoute = null;
function render(forceAnim){
  const h=location.hash.slice(1),c=C(),app=$('#app');
  const routeKey = h + ':' + (c ? c.id : '');
  const isRouteChange = forceAnim || (routeKey !== lastRoute);
  lastRoute = routeKey;
  if (!isRouteChange) app.classList.add('no-anim');
  else app.classList.remove('no-anim');
  app.innerHTML=h==='circulo'?circ():h==='ficha'&&c?sheet(c):home();
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('cur',a.getAttribute('href')==='#'+(h||'inicio')));
}

function fin(R0,pick,c){R0.pick=pick;R0.fin=pick==='gold'?R0.gm:R0.best;const crit=!R0.z&&pick==='best'&&R0.s>1,v=R0.fin;R0.l=crit?'Sucesso crítico':v===6?'Sucesso':v>=4?'Sucesso misto':'Falha';R0.q=crit?'sc2':v===6?'s6':v>=4?'m':'f';const rec=R0.gc>0&&(pick==='gold'||(R0.z?R0.d.some(o=>o.g&&o.v===R0.best):R0.gm===R0.best));if(rec){const x=c.dr[RL.d];x.cur=Math.min(x.max,x.cur+1);R0.rec=true}}
const settle=(R0,c)=>{if(R0.gc>0&&!R0.z&&R0.gm<R0.best)return;fin(R0,'best',c)};
function rollUI(){const c=C(),x=c.dr[RL.d],r=c.ac[RL.n]||0,g=!!c.gold[RL.n],cir=S.circ.ab&&S.circ.ab['Treinamento de Energia']?(S.circ.gd||0):0,tot=r+RL.mot+RL.x+RL.cx,R0=RL.res,stp=(l,f)=>`<div class="st">${l} <button data-a="st" data-f="${f}" data-s="-1">-</button><b>${RL[f]}</b><button data-a="st" data-f="${f}" data-s="1">+</button></div>`;
let body='';if(R0){body=`<div class="dice">${R0.d.map((o,i)=>`<div class="dw"><i class="die ${o.g?'gl':''} ${R0.fin!=null&&o.v===R0.fin?'k':'dim'}" style="--n:${i}">${face(o.v)}</i>${o.g?'<em class="gb">dourado</em>':''}</div>`).join('')}</div>`;
body+=R0.pick==null?`<div class="cnote" style="text-align:center">Há um dado dourado melhor ou pior que o maior: escolha o resultado.</div><div class="row" style="justify-content:center"><button class="btn" data-a="pick" data-v="best">Maior: ${R0.best}</button><button class="btn" data-a="pick" data-v="gold">Dourado: ${R0.gm} (+1 ${RL.d})</button></div>`:`<div class="res ${R0.q}">${R0.l}</div>${R0.rec?`<div class="cnote" style="text-align:center">Dado dourado: +1 ponto de ${RL.d} recuperado.</div>`:''}`}
return `<div class="mod"><h2>${g?'◆ ':''}${RL.n} <small>(${RL.d})</small> ${hb('rolagem')}</h2><div>Dados da ação: <b>${r}</b>${g?' · ação dourada: um dado será dourado':''}</div>${stp(`Motivação gasta (${x.cur} disp.)`,'mot')}${stp('Dados extras de habilidades','x')}${stp('Dados dourados de habilidades','gx')}${cir?stp(`Dados dourados do círculo (${cir})`,'cx'):''}<div class="cnote">${tot<=0?'Sem dados: role 2 e use o menor.':'Total: '+tot+'d6'}</div>${body}<div class="row">${R0&&R0.pick!=null&&!RL.burned?'<button class="btn" data-a="burn">Queimar resistência e rolar de novo</button>':''}<button class="btn" data-a="go">${R0?'Rolar outra vez':'Rolar'}</button><button class="btn" data-a="close">Fechar</button></div></div>`}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t){if(e.target.id==='md')closeM();return}
  if(t.classList.contains('x'))e.stopPropagation();
  const a=t.dataset.a,v=t.dataset,i=+v.i,c=C();
  switch(a){
    case'help':help(v.v);return;
    case'close':closeM();return;
    case'new':{const n=mk();S.chars.push(n);S.cur=n.id;save();location.hash==='#ficha'?render(true):location.hash='ficha';return}
    case'ptr':$('#ptr-file').click();return;
    case'ptrx':e.stopPropagation();c.img='';save();$('#ptr').innerHTML=ptrIn(c);return;
    case'exp':exportChar(v.v);return;
    case'imp':$('#imp-file').click();return;
    case'open':S.cur=v.v;save();location.hash='ficha';return;
    case'ask':openM(`<div class="mod"><h2>Excluir ficha?</h2><p>Esta ação não pode ser desfeita.</p><div class="row"><button class="btn" data-a="del" data-v="${v.v}">Excluir</button><button class="btn" data-a="close">Cancelar</button></div></div>`);return;
    case'del':S.chars=S.chars.filter(x=>x.id!=v.v);save();closeM();render(true);return;
    case'mp':{const x=c.dr[v.d];if(i>=x.max)return toast('Acima do máximo de '+v.d);x.cur=x.cur===i+1?i:i+1;break}
    case'tri':{const x=c.dr[v.d];if(i>=Math.floor(x.max/3))return toast('Cada 3 pontos de Máx. liberam 1 resistência');x.r[i]=x.r[i]?0:1;break}
    case'dot':{const n=v.n;c.ac[n]=(c.ac[n]||0)===i+1?i:i+1;break}
    case'gold':c.gold[v.n]=!c.gold[v.n];break;
    case'mkp':{const m=c.mk;m[v.t]=m[v.t]===i+1?i:i+1;if(m[v.t]===3)toast('Trilha cheia: incapacitado!');break}
    case'task':c.ks=[];c.eq=[];toast('Nova tarefa: equipamento e chaves limpos');break;
    case'roll':RL={n:v.n,d:v.d,mot:0,x:0,gx:0,cx:0,res:null,burned:false};openM(rollUI());return;
    case'st':{const f=v.f,mx=f==='mot'?c.dr[RL.d].cur:f==='cx'?(S.circ.gd||0):9;RL[f]=Math.max(0,Math.min(mx,RL[f]+ +v.s));openM(rollUI());return}
    case'go':{const x=c.dr[RL.d],r=c.ac[RL.n]||0,g=c.gold[RL.n]?1:0,sp0=Math.min(RL.mot,x.cur),cx=Math.min(RL.cx,S.circ.gd||0),n=r+sp0+RL.x+cx,gc=n>0?Math.min(n,g+RL.gx+cx):g+RL.gx+cx;x.cur-=sp0;S.circ.gd=(S.circ.gd||0)-cx;RL.res=rollDice(n,gc);settle(RL.res,c);RL.mot=0;RL.cx=0;RL.burned=false;save();render();openM(rollUI());return}
    case'burn':{const x=c.dr[RL.d],k=x.r.slice(0,Math.floor(x.max/3)).indexOf(0);if(k<0)return toast('Sem resistência disponível em '+RL.d);x.r[k]=1;const g=c.gold[RL.n]?1:0;RL.res=rollDice(c.ac[RL.n]||0,g);settle(RL.res,c);RL.burned=true;save();render();openM(rollUI());return}
    case'pick':fin(RL.res,v.v,c);save();render();openM(rollUI());return;
    case'repre':if(c.spec){applyPre(c,c.spec);toast('Valores iniciais de '+c.spec+' reaplicados')}else toast('Escolha uma especialidade primeiro');break;
    case'fin':c.done=true;break;
    case'reopen':c.done=false;break;
    case'mxset':{const o=v.g==='d'?c.dr[v.t]:S.circ.rs[v.t];setMax(o,i);break}
    case'rp':{const o=S.circ.rs[v.t];if(i>=o.max)return toast('Defina primeiro o Máx.');o.cur=o.cur===i+1?i:i+1;break}
    case'heal':c.heal=(c.heal||0)===i+1?i:i+1;if(c.heal===6)toast('Cicatriz curada! Um ponto de ação pode ser trocado.');break;
    case'cn':S.circ.il=S.circ.il===i+1?i:i+1;break;
    case'il':S.circ.il=Math.min(24,S.circ.il+ +v.v);if(S.circ.il>=24)toast('Contador cheio: avanço de círculo!');break;
    case'clr':S.circ.il=0;break;
    case'gd':S.circ.gd=S.circ.gd===i+1?i:i+1;break;
    case'ctask':S.circ.gd=3;toast('Dados dourados restaurados');break;
    default:return;
  }
  save();render();
});

document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.k;
  if(!k||t.type==='checkbox'||t.tagName==='SELECT')return;
  const o=t.dataset.r?S.circ:C();
  sp(o,k,t.value);
  save();
});

document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.k;
  if(!k)return;
  const o=t.dataset.r?S.circ:C();
  if(t.tagName==='SELECT'&&(k==='role'||k==='spec')){
    const c=C(),v=t.value;
    if(k==='role'){c.role=v;c.spec='';c.ab={};c.ks=[];c.eq=[];c.heal=0;if(AB2[v])c.ab[AB2[v][0][0]]=true}
    else{(AB2[c.spec]||[]).forEach(([n])=>delete c.ab[n]);c.spec=v;c.ks=[];c.eq=[];c.heal=0;if(v){applyPre(c,v);c.ab[AB2[v][0][0]]=true;c.done=false;toast('Valores iniciais de '+v+' aplicados')}}
    save();render();return;
  }
  if(t.type==='checkbox'){
    if(k.startsWith('eq.')&&t.checked){
      const lim=3+(o.ab&&o.ab['Equipado']?1:0);
      if((o.eq||[]).filter(Boolean).length>=lim){
        t.checked=false;
        t.parentElement.classList.add('shake');
        setTimeout(()=>t.parentElement.classList.remove('shake'),400);
        toast('Limite de '+lim+' equipamentos por tarefa');
        return;
      }
    }
    sp(o,k,t.checked);
    save();
    // Se mudou habilidade que tem sub-opção (O Grande Truque, Um Passo à Frente, Cuidados Médicos, Equipado) ou Treinamento de Energia no círculo, re-renderiza sem piscar
    const abName=k.startsWith('ab.')?k.slice(3):'';
    if(['O Grande Truque','Um Passo à Frente','Cuidados Médicos','Equipado','Treinamento de Energia'].includes(abName)){
      render();
      return;
    }
    // Atualiza apenas o contador de equipamentos e o guia de criação sem destruir os checkboxes
    if(!t.dataset.r&&o){
      const eqCount=$('#eq-count');
      if(eqCount){const lim=3+(o.ab&&o.ab['Equipado']?1:0);eqCount.textContent=`${(o.eq||[]).filter(Boolean).length}/${lim}`;}
      const gw=$('#guide-wrap');
      if(gw){const tmp=document.createElement('div');tmp.innerHTML=guide(o);gw.replaceWith(tmp.firstElementChild);}
    }
    return;
  }
  sp(o,k,t.value);
  save();
  if(t.dataset.num)render();
});

addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if((e.key==='Enter'||e.key===' ')&&e.target.id==='ptr'){e.preventDefault();$('#ptr-file').click()}});
const ptrIn=c=>c.img?`<img src="${c.img}" alt="Retrato"><button class="px" data-a="ptrx" aria-label="Remover retrato" title="Remover retrato">×</button>`:'<span>＋<br>Retrato</span>';
$('#ptr-file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';const c=C();if(!f||!c)return;
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const W=180,H=240,k=Math.max(W/im.width,H/im.height),cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const g=cv.getContext('2d');g.fillStyle='#e9dfc8';g.fillRect(0,0,W,H);g.drawImage(im,(W-im.width*k)/2,(H-im.height*k)/2,im.width*k,im.height*k);
    URL.revokeObjectURL(u);c.img=cv.toDataURL('image/jpeg',.85);save();const b=$('#ptr');if(b)b.innerHTML=ptrIn(c);toast('Retrato atualizado')};
  im.onerror=()=>{URL.revokeObjectURL(u);toast('Não foi possível ler a imagem')};im.src=u});
function exportChar(id){const c=S.chars.find(x=>x.id===id);if(!c)return;
  const nm=((c.name||'personagem').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'-').replace(/^-+|-+$/g,''))||'personagem';
  const blob=new Blob([JSON.stringify({app:'candela-obscura-ficha',v:1,char:c},null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='ficha-'+nm+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Ficha exportada')}
function normChar(o){if(!o||typeof o!=='object'||!(o.dr||o.ac))throw new Error('formato');
  const c=Object.assign(mk(),o),str=k=>{c[k]=typeof c[k]==='string'?c[k]:''};
  c.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  if(typeof c.img!=='string'||!/^data:image\/(jpeg|png|webp|gif);base64,/.test(c.img)||c.img.length>400000)c.img='';
  ['name','pron','circle','style','trig','quest','role','spec','eqc','notes'].forEach(str);
  c.dr={};D.forEach(([d])=>{const x=(o.dr&&o.dr[d])||{},mx=Math.max(0,Math.min(9,+x.max||0));c.dr[d]={max:mx,cur:Math.max(0,Math.min(mx,+x.cur||0)),r:[0,1,2].map(i=>x.r&&x.r[i]?1:0)}});
  c.mk=Object.assign({c:0,m:0,s:0},o.mk);['c','m','s'].forEach(k=>{c.mk[k]=Math.max(0,Math.min(3,+c.mk[k]||0))});
  ['ac','gold','ab','opt'].forEach(k=>{if(!c[k]||typeof c[k]!=='object'||Array.isArray(c[k]))c[k]={}});
  ['eq','ks','scx'].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[]});
  c.sc=[0,1,2].map(i=>String((o.sc||[])[i]||''));c.rel=Array.from({length:8},(_,i)=>String((o.rel||[])[i]||''));
  if(!SP.some(x=>x.n===c.spec))c.spec='';if(!R[c.role]){c.role='';c.spec=''}
  return c}
$('#imp-file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),c=normChar(j&&j.char?j.char:j);S.chars.push(c);save();if((location.hash.slice(1)||'inicio')!=='inicio')location.hash='inicio';else render(true);toast('Ficha “'+(c.name||'Sem nome')+'” importada')}catch(err){toast('Arquivo inválido: não é uma ficha exportada')}};
  r.onerror=()=>toast('Não foi possível ler o arquivo');r.readAsText(f)});
render(true);
</script></body></html>
