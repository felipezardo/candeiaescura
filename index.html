                ${allActs.map(ak => {
                  const dk = ACTION_TO_DRIVE[ak];
                  const aName = t.drives[dk].actions[ak].name;
                  const aRat = c.actions[ak] || 0;
                  const aGild = c.gilded.includes(ak) ? '◆ ' : '';
                  return `<option value="${ak}" ${rc.actKey === ak ? 'selected' : ''}>${aGild}${aName} (${aRat}d)</option>`;
                }).join("")}
              </select>
            </div>
            <div>
              <label class="block text-[10px] uppercase tracking-wider text-stone-400 mb-1">${this.lang === 'pt' ? 'Risco (Stakes)' : 'Stakes'}</label>
              <div class="grid grid-cols-3 rounded overflow-hidden border border-stone-700 text-[10px]">
                ${[
                  { id: "low", label: this.lang === "pt" ? "Baixo" : "Low" },
                  { id: "standard", label: this.lang === "pt" ? "Padrão" : "Std" },
                  { id: "high", label: this.lang === "pt" ? "Alto" : "High" }
                ].map(st => `
                  <button onclick="app.setRollStakes('${st.id}')"
                    class="py-1 font-semibold transition ${rc.stakes === st.id ? 'bg-amber-700 text-stone-950' : 'bg-stone-900 text-stone-400 hover:text-white'}">
                    ${st.label}
                  </button>
                `).join("")}
              </div>
            </div>
          </div>

          <!-- Spend Drive Section -->
          <div class="p-2.5 rounded bg-stone-900/90 border border-stone-800 space-y-2 text-xs">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-1.5">
                <span class="text-stone-300 font-medium">${this.lang === 'pt' ? 'Gastar Motivação:' : 'Spend Drive:'}</span>
                ${allowedDrives.length > 1 ? `
                  <select onchange="app.setRollDriveType(this.value)" class="bg-stone-950 border border-amber-700/60 rounded px-1.5 py-0.5 text-[11px] text-amber-300">
                    ${allowedDrives.map(dk => `<option value="${dk}" ${rc.driveToSpend === dk ? 'selected' : ''}>${t.drives[dk].name}</option>`).join("")}
                  </select>
                ` : `<strong class="text-amber-400">${t.drives[rc.driveToSpend].name}</strong>`}
              </div>
              <span class="text-[11px] text-stone-400">${this.lang === 'pt' ? 'Disp.:' : 'Avail:'} <strong class="text-stone-200">${currentDriveAvail}/${currentDriveMax}</strong></span>
            </div>

            <div class="flex items-center justify-between">
              <span class="text-[11px] text-stone-400">${this.lang === 'pt' ? 'Pontos gastos nesta rolagem (+1d cada):' : 'Points spent on this roll (+1d each):'}</span>
              <div class="flex items-center gap-1.5">
                <button onclick="app.adjustRollDriveSpent(-1)" class="w-6 h-6 rounded bg-stone-800 hover:bg-stone-700 font-bold">-</button>
                <span class="w-6 text-center font-bold text-amber-300">${rc.driveSpent}</span>
                <button onclick="app.adjustRollDriveSpent(1)" class="w-6 h-6 rounded bg-stone-800 hover:bg-stone-700 font-bold">+</button>
              </div>
            </div>

            <!-- Contextual Ability Toggles -->
            <div class="flex flex-wrap gap-1.5 pt-1 border-t border-stone-800/80 text-[11px]">
              <button onclick="app.rollContext.gildedOverride = !app.rollContext.gildedOverride; app.renderRollModal();"
                class="px-2 py-0.5 rounded border transition ${rc.gildedOverride ? 'bg-amber-950/80 border-amber-500 text-amber-300 font-semibold' : 'bg-stone-950 border-stone-700 text-stone-400'}">
                ◆ ${this.lang === 'pt' ? 'Ação Dourada' : 'Gilded Action'}
              </button>

              <button onclick="app.rollContext.allyAssist = !app.rollContext.allyAssist; app.renderRollModal();"
                class="px-2 py-0.5 rounded border transition ${rc.allyAssist ? 'bg-amber-950/80 border-amber-500 text-amber-300 font-semibold' : 'bg-stone-950 border-stone-700 text-stone-400'}">
                +1d ${this.lang === 'pt' ? 'Ajuda de Aliado' : 'Ally Assist'}
              </button>

              <button onclick="app.rollContext.firstDrivePlusTwo = !app.rollContext.firstDrivePlusTwo; app.renderRollModal();"
                class="px-2 py-0.5 rounded border transition ${rc.firstDrivePlusTwo ? 'bg-amber-950/80 border-amber-500 text-amber-300 font-semibold' : 'bg-stone-950 border-stone-700 text-stone-400'}"
                title="${this.lang === 'pt' ? '1ª Motivação vale +2d (Detector de Mentiras, Ludibriar, Segurança é Prioridade, Contra a Parede)' : '1st Drive worth +2d'}">
                1ª Motiv. = +2d
              </button>
            </div>

            <!-- Extra Bonus Dice & Extra Gilded Dice -->
            <div class="grid grid-cols-2 gap-2 pt-1 text-[11px]">
              <div class="flex items-center justify-between bg-stone-950/70 px-2 py-1 rounded border border-stone-800">
                <span class="text-stone-400">${this.lang === 'pt' ? 'Dados Bônus:' : 'Bonus Dice:'}</span>
                <div class="flex items-center gap-1">
                  <button onclick="app.adjustRollBonusDice(-1)" class="w-5 h-5 rounded bg-stone-800">-</button>
                  <span class="w-4 text-center font-bold">${rc.bonusDice}</span>
                  <button onclick="app.adjustRollBonusDice(1)" class="w-5 h-5 rounded bg-stone-800">+</button>
                </div>
              </div>
              <div class="flex items-center justify-between bg-stone-950/70 px-2 py-1 rounded border border-stone-800">
                <span class="text-stone-400">${this.lang === 'pt' ? '+Dourados:' : '+Gilded:'}</span>
                <div class="flex items-center gap-1">
                  <button onclick="app.adjustExtraGilded(-1)" class="w-5 h-5 rounded bg-stone-800">-</button>
                  <span class="w-4 text-center font-bold text-amber-400">${rc.extraGildedDice}</span>
                  <button onclick="app.adjustExtraGilded(1)" class="w-5 h-5 rounded bg-stone-800">+</button>
                </div>

            ${(hasMeticulousNotes || hasBasicTraining || hasOpenBook || hasInterrogation || hasExtendSenses) ? `
              <div class="text-[10px] text-amber-300/90 bg-amber-950/30 border border-amber-800/40 rounded px-2 py-1">
                ${this.lang === 'pt' ? 'Habilidade ativa detectada na ficha para esta ação! Use Dados Bônus se aplicável à cena.' : 'Active sheet ability detected for this action! Add Bonus Dice if applicable.'}
              </div>
            ` : ""}
          </div>

          <!-- Roll Trigger Button -->
          <button onclick="app.performActionRoll(false)"
            class="mt-3 w-full py-2.5 px-4 rounded bg-amber-600 hover:bg-amber-500 text-stone-950 font-display font-bold text-xs uppercase tracking-widest shadow-lg transition flex items-center justify-center gap-2">
            <span>${this.lang === 'pt' ? 'Rolar Parada de Dados' : 'Roll Dice Pool'}</span>
            <span class="font-ui px-2 py-0.5 rounded bg-stone-950/20 text-[11px]">
              ${isZeroPreview ? '2d6 (Menor / Lowest)' : `${finalPoolPreview}d6`}
            </span>
          </button>

          ${resultsHtml}
        `;
      },

      /* ========================================================================
         6. JSON IMPORT / EXPORT
         ======================================================================== */
      exportSingleChar(charId) {
        const c = this.characters.find(ch => ch.id === charId) || this.getActiveChar();
        if (!c) return;
        this.downloadJSON({ type: "candela_character", version: 3, character: c }, `candela_${(c.name || "character").toLowerCase().replace(/\s+/g, "_")}.json`);
      },

      exportCurrentJSON() {
        if (this.currentView === "circle") {
          this.downloadJSON({ type: "candela_circle", version: 3, circle: this.circle }, `candela_circle_${(this.circle.name || "sheet").toLowerCase().replace(/\s+/g, "_")}.json`);
        } else {
          this.exportSingleChar(this.activeCharId);
        }
      },

      exportAllBackup() {
        this.downloadJSON({
          type: "candela_full_backup",
          version: 3,
          characters: this.characters,
          circle: this.circle
        }, "candela_obscura_archive.json");
      },

      downloadJSON(obj, filename) {
        const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      },

      triggerImport() {
        document.getElementById("json-file-input").click();
      },

      handleFileImport(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.type === "candela_full_backup") {
              if (Array.isArray(data.characters)) this.characters = data.characters;
              if (data.circle) this.circle = data.circle;
              this.saveCharacters();
              this.saveCircle();
              this.activeCharId = this.characters[0]?.id || null;
              this.navigate("home");
            } else if (data.type === "candela_circle" && data.circle) {
              this.circle = data.circle;
              this.saveCircle();
              this.navigate("circle");
            } else if (data.type === "candela_character" && data.character) {
              const imported = data.character;
              imported.id = "char_" + Date.now();
              this.characters.unshift(imported);
              this.saveCharacters();
              this.activeCharId = imported.id;
              this.navigate("sheet");
            } else if (data.name !== undefined && data.actions !== undefined) {
              data.id = "char_" + Date.now();
              this.characters.unshift(data);
              this.saveCharacters();
              this.activeCharId = data.id;
              this.navigate("sheet");
            }
          } catch (err) {
            alert(this.lang === "pt" ? "Arquivo JSON inválido." : "Invalid JSON file.");
          }
          event.target.value = "";
        };
        reader.readAsText(file);
      }
    };

    window.addEventListener("DOMContentLoaded", () => app.init());
  </script>
</body>
</html>
