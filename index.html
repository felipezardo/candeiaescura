<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Candela Obscura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--p:#e9dfc8;--i:#16110e;--g:#b08a45;--b:#a3322a;--bg:#0d0b0a;--m:#6b6150;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:#ddd3bb}}
:root[data-theme="dark"]{--p:#ddd3bb}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#2b2119,var(--bg) 62%) fixed;color:var(--p);font:19px/1.45 'Cormorant Garamond',Georgia,serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid #3a2f22;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;font-family:Cinzel,serif;letter-spacing:.45em;font-size:20px;line-height:1.1;color:var(--p);text-decoration:none}
.brand svg{width:44px;height:44px;animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{filter:drop-shadow(0 0 3px #b08a45)}45%{filter:drop-shadow(0 0 11px #e0b45f)}60%{filter:drop-shadow(0 0 5px #b08a45)}}
nav{display:flex;gap:6px;margin-left:auto;align-items:center}
nav a{font-family:Cinzel,serif;color:var(--p);text-decoration:none;padding:6px 14px;border-bottom:1px solid transparent;transition:.25s}
nav a:hover,nav a.cur{border-color:var(--g);color:#f3d99a}
.hq{width:24px;height:24px;border:1px solid var(--g);border-radius:50%;color:var(--g);font:600 14px Cinzel,serif;display:inline-grid;place-items:center;transition:.25s;vertical-align:middle;flex:none}
.hq:hover{background:var(--g);color:var(--i);transform:rotate(12deg) scale(1.12)}
main{padding:20px 14px 60px}
h1,h2,h3{font-family:Cinzel,serif;font-weight:400;margin:0}
.wrap{max-width:1000px;margin:0 auto;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.hero{text-align:center;padding:30px 0 22px}.hero h1{font-size:clamp(26px,5vw,44px);letter-spacing:.3em;margin-bottom:8px}.hero p{color:#b9ad92;max-width:560px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:20px}
.card{background:var(--p);color:var(--i);padding:18px 18px 14px;border-radius:22px 4px 22px 4px;position:relative;cursor:pointer;transition:.3s;border:1px solid #0003;text-align:left;min-height:170px;display:flex;flex-direction:column;gap:4px}
.card:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:0 14px 30px #000a,0 0 0 1px var(--g),0 0 24px #b08a4566}
.card h3{font-size:20px}.card small{color:var(--m);font-size:16px}
.card .x{position:absolute;top:8px;right:12px;color:var(--m);font-size:20px;transition:.2s}.card .x:hover{color:var(--b);transform:scale(1.3)}
.mini{margin-top:auto;display:flex;gap:10px;font-size:15px;font-family:Cinzel,serif}
.new{background:transparent;color:var(--g);border:1px dashed var(--g);align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:19px;text-align:center}
.new:hover{background:#b08a4518}
.sheet{max-width:1240px;margin:0 auto;background:var(--p);color:var(--i);border-radius:34px 6px 34px 6px;padding:20px 22px 26px;box-shadow:0 20px 60px #000c,inset 0 0 70px #7a5a2a33;animation:rise .7s ease both}
.hd{display:grid;grid-template-columns:1fr 1fr;gap:6px 40px;margin-bottom:16px;align-items:end}
.hd label{display:grid;grid-template-columns:78px 1fr;align-items:end;font-size:18px;text-align:right;gap:8px}
input[type=text],textarea,select{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--i);width:100%;padding:1px 3px;outline:0;transition:.2s}
input[type=text]:focus,textarea:focus,select:focus{background:#b08a4524;border-color:var(--g)}
select{border:1px solid var(--i);border-radius:3px;font-family:Cinzel,serif;font-size:17px;padding:3px;margin-bottom:6px}
textarea{border:1px solid #0004;min-height:90px;resize:vertical;background:#fff3}
.cols{display:grid;grid-template-columns:1.08fr 1fr .9fr;gap:20px}
@media(max-width:940px){.cols,.hd{grid-template-columns:1fr}.hd label{text-align:left}}
.bar{background:var(--i);color:var(--p);font-family:Cinzel,serif;font-size:20px;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:18px 4px 0 0;flex-wrap:wrap}
.bar small{font-size:12px}
.bar .mx{width:34px;background:#fff1;color:var(--p);text-align:center;border-color:var(--p);font-size:14px}
.mp{display:inline-block;width:9px;height:24px;border:1px solid var(--p);margin-right:2px;cursor:pointer;transition:.2s;vertical-align:middle}
.mp.g{margin-left:6px}.mp.on{background:var(--p);box-shadow:0 0 9px var(--g)}.mp.lk{opacity:.25;border-style:dotted;cursor:not-allowed}.mp:not(.lk):hover{transform:scaleY(1.2)}

.rs{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;font-family:Cinzel,serif;color:var(--m)}
.tri{font-size:22px;color:var(--i);transition:.25s;line-height:1}.tri:hover{transform:translateY(2px);color:var(--g)}.tri.bn{color:var(--b);text-shadow:0 0 8px #a3322a88}
.ar{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.dm{font-size:20px;color:var(--i);transition:.3s;line-height:1.3}.dm.gd{color:var(--g);text-shadow:0 0 8px #e0b45f}.dm:hover{transform:rotate(90deg)}

.dots{display:flex;gap:12px;margin-top:2px}
.dot{width:20px;height:20px;border:2px solid var(--i);border-radius:50%;cursor:pointer;transition:.2s}.dot:hover{transform:scale(1.18)}.dot.on{background:var(--i);box-shadow:0 0 2px var(--p),0 0 3px var(--i)}
h3.t{font-size:23px;margin:4px 0 8px;display:flex;gap:8px;align-items:center}
.ab{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer;font-size:18px;transition:.2s}.ab:hover{color:var(--b);transform:translateX(3px)}
input[type=checkbox]{appearance:none;width:15px;height:15px;border:1.5px solid var(--i);flex:none;margin:5px 0 0;cursor:pointer;transition:.2s;background:transparent}

input[type=checkbox]:checked{background:var(--i);box-shadow:0 0 8px var(--g)}
.keys{font-family:Cinzel,serif;font-size:15px;margin-top:14px;border-top:1px solid var(--i);padding-top:8px}
.btn{font-family:Cinzel,serif;border:1px solid var(--i);padding:5px 14px;border-radius:3px;transition:.25s;background:transparent;color:var(--i);font-size:15px}.btn:hover{background:var(--i);color:var(--p);box-shadow:0 0 14px #b08a45}
.ov .btn{color:var(--p);border-color:var(--g)}.ov .btn:hover{background:var(--g);color:var(--i)}
.mk{display:grid;grid-template-columns:70px 1fr;align-items:center;margin:5px 0;font-family:Cinzel,serif;font-size:15px}
.mk .mp{border-color:var(--i);height:26px;width:20px;margin-right:5px}.mk .mp.on{background:var(--b);border-color:var(--b);box-shadow:0 0 10px #a3322a}
.warn{color:var(--b);font-size:15px;font-style:italic;animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.45}}
.sc{display:flex;gap:6px;align-items:center;margin:6px 0}.rl{display:grid;grid-template-columns:3fr 2fr;gap:2px 22px}
.eq{display:flex;gap:8px;align-items:center;padding:2px 0;font-size:18px;cursor:pointer}
.ov{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:16px;z-index:50;animation:fi .25s}.ov[hidden]{display:none}@keyframes fi{from{opacity:0}}
.mod{background:var(--bg);color:var(--p);border:1px solid var(--g);border-radius:26px 4px 26px 4px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px 26px;box-shadow:0 0 50px #b08a4533;animation:rise .35s}
.mod h2{font-size:23px;margin-bottom:10px;color:#f3d99a}.mod li{margin:6px 0}.mod .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.st{display:flex;align-items:center;gap:10px;margin:8px 0}.st b{min-width:24px;text-align:center;font-size:22px}.st button{width:28px;height:28px;border:1px solid var(--g);border-radius:50%;color:var(--g)}.st button:hover{background:var(--g);color:var(--i)}
.dice{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;justify-content:center}
.die{font-style:normal;font-size:62px;line-height:1;color:var(--p);animation:tm .7s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--n)*90ms)}
.die.gl{color:var(--g);text-shadow:0 0 12px #e0b45f}.die.dim{opacity:.35}.die.k{text-shadow:0 0 14px #fff8}

.res{text-align:center;font-family:Cinzel,serif;font-size:26px;animation:rise .5s .6s both}.res.s6,.res.sc2{color:#f3d99a}.res.m{color:#d9a35c}.res.f{color:var(--b)}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--g);color:var(--i);padding:8px 20px;border-radius:3px;font-family:Cinzel,serif;font-size:15px;opacity:0;pointer-events:none;transition:.35s;z-index:99}#toast.on{opacity:1;transform:translate(-50%,0)}
.shake{animation:sk .4s}@keyframes sk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cnote{color:var(--m);font-size:16px;font-style:italic}

:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.drv{border:3px double var(--i);border-top:0}

.mcol{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px}.mcol small{font-size:11px;font-family:Cinzel,serif;align-self:center;letter-spacing:.05em}
.mb{display:inline-block;width:7px;height:7px;border:1px solid var(--p);margin-right:2px;cursor:pointer;transition:.2s}.mb.g{margin-left:6px}.mb.on{background:#968b78}.mb:hover{border-color:var(--g);transform:scale(1.3)}
input.dia{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:3px 0 0;border:0;background:var(--i);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);position:relative;cursor:pointer;flex:none;transition:.25s}
input.dia::after{content:"";position:absolute;inset:3px;background:var(--p);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:.25s}
input.dia:checked::after{background:var(--g)}input.dia:hover{transform:scale(1.2)}
.ab2{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:16px;line-height:1.3;cursor:pointer;transition:.2s}.ab2:hover{color:var(--b)}.ab2 b{font-weight:600}.ab2 i{color:#4a3d2c}.ab2 select,.ab2 input[type=text]{font-size:15px;margin-top:4px}
.sc input.dia{margin:0}
.spread{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:10px}@media(max-width:900px){.spread{grid-template-columns:1fr}}
.hh{font-family:Cinzel,serif;font-size:27px;margin:16px 0 6px;font-weight:400}.pg p{margin:6px 0;font-size:17px}.pg ul{margin:4px 0;padding-left:22px;font-size:17px}
.ring{position:relative;width:260px;height:260px;flex:none;margin:0 auto}
.rc{position:absolute;width:21px;height:21px;border:2px solid var(--i);border-radius:50%;background:var(--p);transform:translate(-50%,-50%);cursor:pointer;transition:.25s}.rc.ms{border-width:5px}.rc.ms::after{content:"";position:absolute;inset:1px;border:1px solid var(--m);border-radius:50%}.rc:hover{transform:translate(-50%,-50%) scale(1.25)}.rc.on{background:var(--g);box-shadow:0 0 10px #e0b45f}
.candle{position:absolute;left:50%;top:50%;width:54px;transform:translate(-50%,-50%)}.fl{animation:fk 2.2s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}@keyframes fk{50%{transform:scale(1.08,.94) rotate(2deg)}}
.rbar{background:var(--i);color:var(--p);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 14px;margin:8px 0;font-family:Cinzel,serif;font-size:22px;border-radius:16px 3px 16px 3px}
.trk{display:flex;align-items:center;margin:8px 0}.trk b{width:17px;height:17px;border:2px solid var(--i);border-radius:50%;cursor:pointer;background:var(--p);transition:.2s;flex:none}.trk b.on{background:var(--i)}.trk b+b{margin-left:22px;position:relative}.trk b+b::before{content:"";position:absolute;right:100%;top:5px;width:22px;border-top:2px solid var(--i)}
.gl{display:block;margin:12px 0}.hd2{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.hd2 label{display:flex;gap:8px;align-items:end;flex:1;min-width:230px}
.gbox{border:1px dashed var(--i);border-radius:14px 3px 14px 3px;padding:10px 14px;margin:0 0 16px;background:#b08a4518;animation:rise .5s both}.gbox .btn{font-size:13px;padding:3px 10px}
.chip{display:inline-block;border:1px solid var(--m);border-radius:20px;padding:0 10px;margin:3px 4px 3px 0;font-family:Cinzel,serif;font-size:14px;transition:.3s}.chip.ok{background:var(--i);color:#f3d99a;border-color:var(--g)}
.tri.lk{opacity:.22;cursor:not-allowed}.tri.lk:hover{transform:none;color:var(--i)}
.dw{display:flex;flex-direction:column;align-items:center}.gb{font:600 11px Cinzel,serif;color:var(--g);font-style:normal;letter-spacing:.08em}
.die.gl{position:relative;animation:tm .7s cubic-bezier(.2,.8,.3,1) both,sh 2.2s ease-in-out infinite .9s;animation-delay:calc(var(--n)*90ms),calc(var(--n)*90ms + .9s)}@keyframes sh{50%{text-shadow:0 0 22px #ffd98a,0 0 4px #fff;filter:brightness(1.25)}}
.die.k{color:#f3d99a}.die.gl.k{color:#ffd98a}
#app.no-anim .wrap,#app.no-anim .sheet,#app.no-anim .gbox{animation:none!important}
.card .x.ex{right:40px;font-size:17px}.card .x.ex:hover{color:var(--g)}
.hero .btn{color:var(--p);border-color:var(--g)}.hero .btn:hover{background:var(--g);color:var(--i)}
.sel-d{display:block}.pick-m{display:none}
@media(max-width:940px){.sel-d{display:none}.pick-m{display:grid;gap:10px;margin:0 0 14px}.pick-m label{display:grid;gap:3px;font-family:Cinzel,serif;font-size:17px}.pick-m select{margin:0;font-size:18px;padding:6px}}
.top2{display:flex;gap:20px;align-items:flex-start}.top2 .hd{flex:1;min-width:0}
#ptr{position:relative;width:84px;height:112px;flex:none;border:2px solid var(--i);border-radius:16px 3px 16px 3px;overflow:hidden;cursor:pointer;background:repeating-linear-gradient(45deg,#16110e10 0 6px,transparent 6px 12px);transition:.3s;display:grid;place-items:center;text-align:center;font:600 11px/1.2 Cinzel,serif;color:var(--m)}

#ptr:hover .px,#ptr:focus-within .px{opacity:.9}.px:hover{background:var(--b)}
@media(hover:none){#ptr .px{opacity:.85}}
@media(max-width:940px){.top2{gap:14px}#ptr{width:68px;height:90px}}
.card .th{position:absolute;right:14px;top:40px;width:72px;height:96px;object-fit:cover;border:1px solid var(--i);border-radius:8px 2px 8px 2px;filter:sepia(.22)}
.card .th~small{padding-right:84px}
.card:has(.th){min-height:210px}
.vt .hero .btn,.conn .btn{color:var(--p);border-color:var(--g)}.vt .hero .btn:hover,.conn .btn:hover{background:var(--g);color:var(--i)}
.pn{background:var(--p);color:var(--i);border-radius:22px 4px 22px 4px;padding:16px 20px;margin:16px 0;box-shadow:0 12px 34px #000a;animation:rise .6s both}.pn h3{font-size:22px;margin-bottom:8px}.pn .btn{margin:2px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar2 input{width:auto;min-width:200px;flex:1}
.code{font:600 36px Cinzel,serif;letter-spacing:.3em;margin:4px 0}
.pgrid,.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.tg{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.pc{border:1px solid var(--i);border-radius:14px 3px 14px 3px;padding:10px 12px;position:relative;cursor:pointer;transition:.25s;background:#ffffff30}.pc:hover{box-shadow:0 0 0 1px var(--g),0 8px 20px #0006;transform:translateY(-3px)}.pc.off{opacity:.5}
.pc b{font-family:Cinzel,serif;font-size:19px;display:block;padding-right:48px}.pc small{display:block;color:var(--m)}
.pth{position:absolute;right:10px;top:10px;width:42px;height:56px;object-fit:cover;border:1px solid var(--i);border-radius:6px 2px 6px 2px}
.pd{display:grid;grid-template-columns:72px 40px 1fr;font-size:15px;font-family:Cinzel,serif}.pm{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;margin-top:4px}

.stage img{width:100%;height:100%;object-fit:contain;animation:fi 1.1s}.stage .cap{position:absolute;bottom:0;left:0;right:0;padding:18px;text-align:center;font:22px Cinzel,serif;letter-spacing:.15em;background:linear-gradient(transparent,#000c)}.stage .empty{color:var(--m);font-style:italic;padding:20px;text-align:center}
.rolls{max-height:75vh;overflow:auto}.re{background:var(--p);color:var(--i);border-radius:14px 3px 14px 3px;padding:8px 12px;margin-bottom:10px;animation:rise .5s both}.re .dice{margin:4px 0}.die.sm{font-size:42px;color:var(--i)}.die.sm.gl{color:#9a6f1c}.re .res{font-size:19px;animation:none;color:var(--i)}.re .res.f{color:var(--b)}

Soldado|Treinamento Básico|você tem experiência tática em situações de estresse alto. Ao rolar Avaliar em um lugar perigoso, adicione um número de dados igual à sua resistência de Vigor atual.

Médico|Dissecação|ao rolar Focar para dissecar matéria orgânica afetada pela sangria, torne dourado mais um dado. Você não pode sofrer marcas da Sangria desta inspeção.
Médico|Reanimação|quando um aliado próximo sofrer uma cicatriz, você pode rolar Focar para tentar reanimá-lo imediatamente. Se tirar 6, você consegue. Embora ainda vá sofrer a cicatriz, o aliado fica de pé. Se tirar 4 ou 5, isso custará 3 pontos de motivação à sua escolha. Não é possível reanimar quando um PJ sofrer sua quarta cicatriz.
Médico|Cuidados Médicos|entre tarefas, você pode gastar 1 Curar para tratar a cicatriz de um aliado. Quando fizer isso, role Focar. Se for um sucesso crítico, preencha três. Se tirar 6, preencha duas. Se tirar 4 ou 5, preencha uma. Quando o contador estiver cheio, a cicatriz é curada e 1 ponto de ação pode ser trocado.
Médico|Golpe Anatômico|você sabe qual é a parte mais vulnerável do corpo. Quando atacar um inimigo, você pode rolar Focar em vez de Atacar.

Professor|Segurança é Prioridade|ao rolar Controlar ou Mover para fugir do perigo, torne dourado um dado. Nesta rolagem, o primeiro Vigor que você gastar vale +2d em vez de +1d.
Professor|Eloquente|ao fazer um discurso ou manter uma conversa para ajudar um aliado, o dado que você lhe concede é dourado.
Professor|Mistura Química|você sabe misturar produtos químicos para obter efeitos específicos. Quando escolhe o equipamento laboratorial, você pode passar alguns minutos produzindo uma mistura que é: <i>ácida, explosiva, inflamável, barulhenta, sonífera, pegajosa ou tóxica.</i>
Criminoso|Malandragem de Rua|você sabe ficar de olho em seus arredores. Toda vez que rolar Avaliar, você pode gastar qualquer motivação em vez de apenas Intuição.
Criminoso|Aproveitar|se rolar Ler com sucesso, você pode perguntar ao mestre o que o seu alvo quer de verdade. Adicione um número de dados igual à sua resistência de Astúcia atual às rolagens de Influenciar que você fizer usando esta informação.
Criminoso|Casca-grossa|ao sofrer uma cicatriz, você pode optar por não mudar pontos de ação como resultado.
Criminoso|Nascido nas Sombras|quando estiver evitando seguranças ou detecções, torne dourado mais um dado de Esconder.
Criminoso|Manhas do Ofício|você aprendeu a resolver situações complicadas ou perigosas para não se colocar em apuros. Você pode gastar 1 Vigor para reduzir o risco antes de rolar Esconder ou Influenciar. Se a rolagem já for de baixo risco, você não pode usar esta habilidade.
Criminoso|Dedos Pegajosos|após um sucesso em um ataque corpo a corpo, você pode gastar 1 Astúcia para furtar um item do alvo sem ele notar. <i>Pode ser uma carteira, uma arma, um documento importante etc.</i>
Detetive|Palácio Mental|quando você quiser descobrir como duas pistas se relacionam ou o caminho ao qual elas apontam, apague 1 resistência de Intuição. O mestre contará que informações você deduziu.
Detetive|Interrogatório|quando estiver fazendo perguntas a uma pessoa relutante em fornecer informações, adicione um número de dados igual à sua resistência de Astúcia atual à sua rolagem de Ler.
Detetive|Contra a Parede|quando fizer uma rolagem de risco alto, você pode sofrer uma marca da Mente para fazer seu Vigor gasto valer +2d em vez de +1d.
Detetive|Inspeção|você é experiente em examinar cenas de crimes. Quando rolar Avaliar para coletar evidências sobre o que pode ter ocorrido em um local, torne dourado mais um dado desta rolagem.
Detetive|Tocaia|você sabe obter informações sem detectarem sua presença. Quando estiver seguindo um suspeito ou fazendo vigilância, você pode usar Avaliar em vez de Esconder.
Detetive|Um Passo à Frente|uma vez por tarefa, você pode apresentar um objeto mundano e útil que levava consigo desde o início. Quando fizer isso, marque o espaço de equipamento vazio e anote o objeto nesta seção. O objeto não é contado no seu limite de equipamentos.
Médium|Miasma|você pode gastar 1 Intuição para entender se e como uma pessoa ou objeto foi afetado pela sangria.
Médium|Entortar Colheres|você pode rolar Sentir para controlar, usando a mente, um objeto no cômodo em que está para: <i>ligar um interruptor, derrubar algo, mover um objeto pequeno, desligar uma luz etc.</i> Em um sucesso misto, você pode sofrer uma marca da Sangria para tornar a rolagem um sucesso completo.
Médium|Leitura Fria|em um sucesso em uma rolagem de Sentir, você entende por qual doença, estresse ou perda uma pessoa passou na vida, mesmo que ela esteja tentando escondê-la.
Médium|Premonições|você tem visões do futuro. Quando um aliado estiver prestes a sofrer 1 ou mais marcas, apague uma resistência de Intuição para avisá-lo do perigo vindouro. Em seguida, absorva uma dessas marcas.
Médium|Momentos Finais|ao tocar em um cadáver, você pode apagar uma resistência de Intuição para ouvir, cheirar e sentir os últimos momentos da vida daquela criatura. Escolhendo sofrer uma marca da Sangria, você pode ir além e ver uma imagem da última coisa que ela viu antes da morte.
Médium|Comungar|você pode se conectar com um fenômeno senciente próximo para se comunicar com ele. Sofra uma marca da Mente e role Sentir para estabelecer um vínculo empático ou telepático e fazer uma pergunta. Em um sucesso, você consegue uma resposta. Se tirar 4 ou 5, o fenômeno fará uma pergunta de volta.
Ocultista|Lâmina Fantasma|você pode sintonizar uma faca ritualística a si. Se banhá-la em seu sangue (sofra uma marca do Corpo), ela se torna bastante efetiva contra seres mágicos e pode atingir inimigos invisíveis ou etéreos.
Ocultista|Sangue do Pacto|na primeira vez que um fenômeno perigoso causar uma marca em alguém do círculo, você recupera um número de pontos, de qualquer motivação, igual à sua resistência de Intuição atual.
Ocultista|Falar a Língua Deles|você sabe falar a linguagem sobrenatural de qualquer fenômeno que encontrar. Descreva de que maneira estranha ou aterrorizante vocês se comunicam.
Ocultista|Bancar a Isca|você sabe chamar a atenção de um fenômeno – é só se colocar de isca. Role Sentir para atrair um fenômeno próximo para sua direção.
Ocultista|Estender Seus Sentidos|ao rolar Sentir para entender mais sobre um fenômeno que você encontrou, adicione à rolagem um número de dados igual à sua resistência atual.
Ocultista|Ritual Proibido|você conhece um ritual muito complexo ou extremamente perigoso que terá um resultado desejado. Ao usá-lo, você sofre uma cicatriz da Sangria imediatamente. Determine o tipo de ritual e seus efeitos: <i>mudar o ambiente, conjurar um fenômeno ou salvar uma pessoa moribunda.</i>`;

<div style="flex:1;min-width:210px"><h3 style="font-size:18px">Avanço de círculo</h3><p>Quando o contador de iluminação estiver cheio, apague-o. Qualquer iluminação restante contará para o seu próximo ciclo de avanço. Em seguida, escolha uma nova habilidade de círculo; todos os jogadores podem escolher suas opções de avanço de personagem.</p><p class="cnote">Os círculos em negrito representam marcos, os quais podem ter benefícios nas mecânicas, dependendo das habilidades que o círculo possui.</p>${c.il>=24?`<div class="warn">Contador cheio: hora do avanço!${c.ex?' Excedente: '+c.ex:''}</div>`:''}<button class="btn" data-a="clr">Limpar contador</button></div></div>
<h3 class="hh">Avanço de personagem</h3><p><b>No avanço de personagem, cada jogador pode escolher entre duas opções:</b></p><ul><li>Adicione 1 ponto de ação.</li><li>Adicione 2 pontos de motivação.</li><li>Escolha uma nova habilidade.</li><li>Torne dourada mais uma ação.</li></ul><p class="cnote">Em um avanço de personagem, apenas um ponto de ação pode ser trocado.</p>
<h3 class="hh">Recursos da Candela Obscura</h3><p><b>Em cada um dos recursos a seguir, preencha ambas as seções (superior e inferior) com um mais o número de membros do círculo. Entre tarefas, cada jogador pode gastar até dois recursos à escolha dele. Ao usar recursos, apague apenas a seção de cima.</b></p>${['Curar','Renovar','Treinar'].map(rb).join('')}
<h3 class="hh">Equipamento do círculo</h3><div class="rl" style="grid-template-columns:1fr 1fr">${c.gear.map((g,i)=>inp('gear.'+i,1)).join('')}</div></div></div></div>`}

const PRE=`Jornalista|Ler1,Avaliar2,Focar1,Sentir1|Avaliar|Astúcia3
Mágico|Influenciar2,Ler1,Esconder1,Focar1|Influenciar|Astúcia1,Intuição2
Explorador|Mover1,Atacar2,Avaliar1,Focar1|Mover|Vigor3
Soldado|Mover2,Atacar2,Controlar1|Atacar|Vigor1,Intuição2
Médico|Controlar1,Ler1,Avaliar1,Focar2|Ler|Intuição3
Professor|Influenciar1,Avaliar2,Focar2|Focar|Astúcia2,Intuição1
Criminoso|Controlar1,Esconder2,Avaliar1,Focar1|Esconder|Vigor1,Astúcia2
Detetive|Controlar1,Esconder1,Avaliar2,Focar1|Controlar|Vigor2,Astúcia1
Médium|Ler2,Avaliar1,Sentir2|Sentir|Astúcia1,Intuição2
Ocultista|Controlar1,Ler1,Focar1,Sentir2|Focar|Intuição3`;
const PREM={};const sp2=s=>s.split(',').map(t=>[t.slice(0,-1),+t.slice(-1)]);PRE.split('\n').forEach(l=>{const[n,a,g,d]=l.split('|');PREM[n]={a:sp2(a),g,d:sp2(d)}});
function applyPre(c,n){const p=PREM[n];if(!p)return;c.ac={};c.gold={};p.a.forEach(([k,v])=>c.ac[k]=v);c.gold[p.g]=true;D.forEach(([d])=>{const m=(p.d.find(x=>x[0]===d)||[0,0])[1];c.dr[d]={cur:m,max:m,r:[0,0,0]}})}
function guide(c){if(c.done)return '<div id="guide-wrap" style="text-align:right;margin-bottom:8px"><button class="btn" data-a="reopen">Guia de criação</button></div>';
const sm=o=>Object.values(o).reduce((a,b)=>a+b,0),ac=sm(c.ac),mx=D.reduce((s,[d])=>s+c.dr[d].max,0),gd=Object.values(c.gold).filter(Boolean).length,rn=(AB2[c.role]||[]).filter(([n])=>c.ab[n]).length,sn=(AB2[c.spec]||[]).filter(([n])=>c.ab[n]).length,o2=Object.values(c.ac).some(v=>v>2),o6=D.some(([d])=>c.dr[d].max>6);
const ch=(ok,t)=>`<span class="chip ${ok?'ok':''}">${ok?'✓':'o'} ${t}</span>`;
const nx=!c.role?'Escolha um papel.':!c.spec?'Escolha uma especialidade: ações, motivações e ação dourada iniciais entram sozinhas.':ac<9?`Faltam ${9-ac} ponto(s) de ação: suba uma ação de nível 0 para 1 e distribua 3 pontos livres.`:ac>9?'Há mais pontos de ação do que o previsto na criação.':mx<9?`Faltam ${9-mx} ponto(s) de motivação para distribuir.`:mx>9?'Há mais motivações do que o previsto na criação.':gd<2?'Doure mais uma ação à sua escolha (clique no ◇).':rn<1||sn<1?'Marque uma habilidade de papel e uma de especialidade.':'Tudo certo! Preencha nome, relações e equipamento e conclua.';
return `<div id="guide-wrap"><div class="gbox"><b style="font-family:Cinzel,serif">Guia de criação</b> ${hb('guia')}<div>${ch(ac===9&&!o2,`Ações ${ac}/9`)}${ch(mx===9&&!o6,`Motivações ${mx}/9`)}${ch(gd===2,`Douradas ${gd}/2`)}${ch(rn===1,`Papel ${rn}/1`)}${ch(sn===1,`Especialidade ${sn}/1`)}</div><div class="cnote">${nx}${o2?' Nenhuma ação passa de 2 na criação.':''}${o6?' Nenhum impulso passa de 6 na criação.':''}</div><div style="margin-top:6px"><button class="btn" data-a="repre">Reaplicar valores iniciais</button> <button class="btn" data-a="fin">Concluir criação</button></div></div></div>`}
HT.guia=['Guia de criação','<p>Escolha um <b>papel</b> e uma <b>especialidade</b>: o site já preenche os valores iniciais dela.</p><ol><li><b>Ações:</b> 5 pontos vêm da especialidade. Suba uma ação de nível 0 para 1 e distribua mais 3 pontos livres. Nenhuma ação passa de 2.</li><li><b>Motivações:</b> 3 pontos de Máx. vêm da especialidade. Distribua mais 6 livres, até 6 por impulso.</li><li><b>Resistência:</b> cada 3 pontos de Máx. de um impulso liberam 1 resistência.</li><li><b>Ações douradas:</b> uma vem da especialidade; doure mais uma, de preferência de um impulso que você tenha pontos para gastar.</li><li><b>Habilidades:</b> uma do papel e uma da especialidade (a primeira já vem marcada).</li><li><b>Equipamento, relações e conceito:</b> preencha com o grupo e o mestre.</li></ol><p>Os contadores no topo da ficha mostram o que falta.</p>'];
HT.res=['Resistência','<p>A cada <b>3 pontos de Máx.</b> de um impulso você ganha 1 resistência (triângulos bloqueados ainda não foram liberados). Ela não diminui quando você gasta motivação.</p><p>Queimar uma resistência permite <b>rolar de novo</b> um número de dados igual ao valor da ação (sem os dados de motivação ou ajuda). O botão aparece no resultado da rolagem.</p>'];
HT.rolagem=['Como rolar','<p>Role um d6 por ponto da ação. Gastar motivação do impulso da ação soma dados. O mestre diz o risco antes.</p><ul><li><b>6:</b> sucesso completo.</li><li><b>4 ou 5:</b> sucesso misto.</li><li><b>1 a 3:</b> falha.</li><li><b>Dois ou mais 6:</b> crítico.</li><li><b>Ação com 0 pontos:</b> role 2 dados e fique com o <b>menor</b> (sem crítico).</li></ul><p><b>Dado dourado:</b> numa ação dourada (◆), um dos seus dados vira dourado. Habilidades podem dourar mais dados. Depois de rolar você pode escolher o resultado do dado dourado, mesmo menor, para <b>recuperar 1 motivação</b> do impulso da ação. Com ação 0, não há escolha, mas se o dourado for o menor você recupera.</p>'];
function rollDice(n,gc){const z=n<=0,k=z?2:n,d=Array.from({length:k},(_,i)=>({v:1+Math.floor(Math.random()*6),g:i<gc})),vs=d.map(o=>o.v),gm=Math.max(0,...d.filter(o=>o.g).map(o=>o.v));return{d,z,gc,gm,gmax:gm,best:z?Math.min(...vs):Math.max(...vs),s:vs.filter(v=>v===6).length,pick:null,fin:null,rec:false,l:'',q:''}}
function fin(R0,pick,c){R0.pick=pick;R0.fin=pick==='gold'?R0.gm:R0.best;const crit=!R0.z&&pick==='best'&&R0.s>1,v=R0.fin;R0.l=crit?'Sucesso crítico':v===6?'Sucesso':v>=4?'Sucesso misto':'Falha';R0.q=crit?'sc2':v===6?'s6':v>=4?'m':'f';const rec=R0.gc>0&&(pick==='gold'||(R0.z?R0.d.some(o=>o.g&&o.v===R0.best):R0.gm===R0.best));if(rec){const x=c.dr[RL.d];x.cur=Math.min(x.max,x.cur+1);R0.rec=true}}
const settle=(R0,c)=>{if(R0.gc>0&&!R0.z&&R0.gm<R0.best)return;fin(R0,'best',c)};
function rollUI(){const c=C(),x=c.dr[RL.d],r=c.ac[RL.n]||0,g=!!c.gold[RL.n],cir=S.circ.ab&&S.circ.ab['Treinamento de Energia']?(S.circ.gd||0):0,tot=r+RL.mot+RL.x+RL.cx,R0=RL.res,stp=(l,f)=>`<div class="st">${l} <button data-a="st" data-f="${f}" data-s="-1">-</button><b>${RL[f]}</b><button data-a="st" data-f="${f}" data-s="1">+</button></div>`;
let body='';if(R0){body=`<div class="dice">${R0.d.map((o,i)=>`<div class="dw"><i class="die ${o.g?'gl':''} ${R0.fin!=null&&o.v===R0.fin?'k':'dim'}" style="--n:${i}">${face(o.v)}</i>${o.g?'<em class="gb">dourado</em>':''}</div>`).join('')}</div>`;
body+=R0.pick==null?`<div class="cnote" style="text-align:center">Há um dado dourado melhor ou pior que o maior: escolha o resultado.</div><div class="row" style="justify-content:center"><button class="btn" data-a="pick" data-v="best">Maior: ${R0.best}</button><button class="btn" data-a="pick" data-v="gold">Dourado: ${R0.gm} (+1 ${RL.d})</button></div>`:`<div class="res ${R0.q}">${R0.l}</div>${R0.rec?`<div class="cnote" style="text-align:center">Dado dourado: +1 ponto de ${RL.d} recuperado.</div>`:''}`}
return `<div class="mod"><h2>${g?'◆ ':''}${RL.n} <small>(${RL.d})</small> ${hb('rolagem')}</h2><div>Dados da ação: <b>${r}</b>${g?' · ação dourada: um dado será dourado':''}</div>${stp(`Motivação gasta (${x.cur} disp.)`,'mot')}${stp('Dados extras de habilidades','x')}${stp('Dados dourados de habilidades','gx')}${cir?stp(`Dados dourados do círculo (${cir})`,'cx'):''}<div class="cnote">${tot<=0?'Sem dados: role 2 e use o menor.':'Total: '+tot+'d6'}</div>${body}<div class="row">${R0&&R0.pick!=null&&!RL.burned?'<button class="btn" data-a="burn">Queimar resistência e rolar de novo</button>':''}<button class="btn" data-a="go">${R0?'Rolar outra vez':'Rolar'}</button><button class="btn" data-a="close">Fechar</button></div></div>`}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t){if(e.target.id==='md')closeM();return}
  if(t.classList.contains('x'))e.stopPropagation();
  const a=t.dataset.a,v=t.dataset,i=+v.i,c=C();
  switch(a){
    case'help':help(v.v);return;
    case'close':closeM();return;
    case'new':{const n=mk();S.chars.push(n);S.cur=n.id;save();location.hash==='#ficha'?render(true):location.hash='ficha';return}
    case'ptr':$('#ptr-file').click();return;
    case'ptrx':e.stopPropagation();c.img='';save();$('#ptr').innerHTML=ptrIn(c);return;
    case'exp':exportChar(v.v);return;
    case'imp':$('#imp-file').click();return;
    case'open':S.cur=v.v;save();location.hash='ficha';return;
    case'ask':openM(`<div class="mod"><h2>Excluir ficha?</h2><p>Esta ação não pode ser desfeita.</p><div class="row"><button class="btn" data-a="del" data-v="${v.v}">Excluir</button><button class="btn" data-a="close">Cancelar</button></div></div>`);return;
    case'del':S.chars=S.chars.filter(x=>x.id!=v.v);save();closeM();render(true);return;
    case'mp':{const x=c.dr[v.d];if(i>=x.max)return toast('Acima do máximo de '+v.d);x.cur=x.cur===i+1?i:i+1;break}
    case'tri':{const x=c.dr[v.d];if(i>=Math.floor(x.max/3))return toast('Cada 3 pontos de Máx. liberam 1 resistência');x.r[i]=x.r[i]?0:1;break}
    case'dot':{const n=v.n;c.ac[n]=(c.ac[n]||0)===i+1?i:i+1;break}
    case'gold':c.gold[v.n]=!c.gold[v.n];break;
    case'mkp':{const m=c.mk;m[v.t]=m[v.t]===i+1?i:i+1;if(m[v.t]===3)toast('Trilha cheia: incapacitado!');break}
    case'task':c.ks=[];c.eq=[];toast('Nova tarefa: equipamento e chaves limpos');break;
    case'roll':RL={n:v.n,d:v.d,mot:0,x:0,gx:0,cx:0,res:null,burned:false};openM(rollUI());return;
    case'st':{const f=v.f,mx=f==='mot'?c.dr[RL.d].cur:f==='cx'?(S.circ.gd||0):9;RL[f]=Math.max(0,Math.min(mx,RL[f]+ +v.s));openM(rollUI());return}
    case'go':{const x=c.dr[RL.d],r=c.ac[RL.n]||0,g=c.gold[RL.n]?1:0,sp0=Math.min(RL.mot,x.cur),cx=Math.min(RL.cx,S.circ.gd||0),n=r+sp0+RL.x+cx,gc=n>0?Math.min(n,g+RL.gx+cx):g+RL.gx+cx;x.cur-=sp0;S.circ.gd=(S.circ.gd||0)-cx;RL.res=rollDice(n,gc);settle(RL.res,c);RL.mot=0;RL.cx=0;RL.burned=false;save();render();openM(rollUI());return}
    case'burn':{const x=c.dr[RL.d],k=x.r.slice(0,Math.floor(x.max/3)).indexOf(0);if(k<0)return toast('Sem resistência disponível em '+RL.d);x.r[k]=1;const g=c.gold[RL.n]?1:0;RL.res=rollDice(c.ac[RL.n]||0,g);settle(RL.res,c);RL.burned=true;save();render();openM(rollUI());return}
    case'pick':fin(RL.res,v.v,c);save();render();openM(rollUI());return;
    case'repre':if(c.spec){applyPre(c,c.spec);toast('Valores iniciais de '+c.spec+' reaplicados')}else toast('Escolha uma especialidade primeiro');break;
    case'fin':c.done=true;break;
    case'reopen':c.done=false;break;
    case'mxset':{const o=v.g==='d'?c.dr[v.t]:S.circ.rs[v.t];setMax(o,i);break}
    case'rp':{const o=S.circ.rs[v.t];if(i>=o.max)return toast('Defina primeiro o Máx.');o.cur=o.cur===i+1?i:i+1;break}
    case'heal':c.heal=(c.heal||0)===i+1?i:i+1;if(c.heal===6)toast('Cicatriz curada! Um ponto de ação pode ser trocado.');break;
    case'cn':S.circ.il=S.circ.il===i+1?i:i+1;break;
    case'il':{const c=S.circ,old=c.il,sum=old+ +v.v;c.il=Math.min(24,sum);c.ex=Math.max(0,sum-24);if(c.ab&&c.ab['Gestão de Recursos']&&[7,14,21].some(m=>old<m&&sum>=m))toast('Marco de iluminação: recupere 1 recurso (Curar, Renovar ou Treinar)');if(sum>=24)toast('Contador cheio: avanço de círculo!'+(c.ex?' Sobram '+c.ex+' para o próximo ciclo.':''));break}
    case'clr':S.circ.il=Math.min(24,S.circ.ex||0);S.circ.ex=0;break;
    case'gd':S.circ.gd=S.circ.gd===i+1?i:i+1;break;
    case'ctask':S.circ.gd=3;toast('Dados dourados restaurados');break;
    default:return;
  }
  save();render();
});

document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.k;
  if(!k||t.type==='checkbox'||t.tagName==='SELECT')return;
  const o=t.dataset.r?S.circ:C();
  sp(o,k,t.value);
  save();
});

document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.k;
  if(!k)return;
  const o=t.dataset.r?S.circ:C();
  if(t.tagName==='SELECT'&&(k==='role'||k==='spec')){
    const c=C(),v=t.value;
    if(k==='role'){c.role=v;c.spec='';c.ab={};c.ks=[];c.eq=[];c.heal=0;if(AB2[v])c.ab[AB2[v][0][0]]=true}
    else{(AB2[c.spec]||[]).forEach(([n])=>delete c.ab[n]);c.spec=v;c.ks=[];c.eq=[];c.heal=0;if(v){applyPre(c,v);c.ab[AB2[v][0][0]]=true;c.done=false;toast('Valores iniciais de '+v+' aplicados')}}
    save();render();return;
  }
  if(t.type==='checkbox'){
    if(k.startsWith('eq.')&&t.checked){
      const lim=3+(o.ab&&o.ab['Equipado']?1:0);
      if((o.eq||[]).filter(Boolean).length>=lim){
        t.checked=false;
        t.parentElement.classList.add('shake');
        setTimeout(()=>t.parentElement.classList.remove('shake'),400);
        toast('Limite de '+lim+' equipamentos por tarefa');
        return;
      }
    }
    sp(o,k,t.checked);
    save();
    // Se mudou habilidade que tem sub-opção (O Grande Truque, Um Passo à Frente, Cuidados Médicos, Equipado) ou Treinamento de Energia no círculo, re-renderiza sem piscar
    const abName=k.startsWith('ab.')?k.slice(3):'';
    if(['O Grande Truque','Um Passo à Frente','Cuidados Médicos','Equipado','Treinamento de Energia'].includes(abName)){
      render();
      return;
    }
    // Atualiza apenas o contador de equipamentos e o guia de criação sem destruir os checkboxes
    if(!t.dataset.r&&o){
      const eqCount=$('#eq-count');
      if(eqCount){const lim=3+(o.ab&&o.ab['Equipado']?1:0);eqCount.textContent=`${(o.eq||[]).filter(Boolean).length}/${lim}`;}
      const gw=$('#guide-wrap');
      if(gw){const tmp=document.createElement('div');tmp.innerHTML=guide(o);gw.replaceWith(tmp.firstElementChild);}
    }
    return;
  }
  sp(o,k,t.value);
  save();
  if(t.dataset.num)render();
});

addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if((e.key==='Enter'||e.key===' ')&&e.target.id==='ptr'){e.preventDefault();$('#ptr-file').click()}});
const ptrIn=c=>c.img?`<img src="${c.img}" alt="Retrato"><button class="px" data-a="ptrx" aria-label="Remover retrato" title="Remover retrato">×</button>`:'<span>＋<br>Retrato</span>';
$('#ptr-file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';const c=C();if(!f||!c)return;
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const W=180,H=240,k=Math.max(W/im.width,H/im.height),cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const g=cv.getContext('2d');g.fillStyle='#e9dfc8';g.fillRect(0,0,W,H);g.drawImage(im,(W-im.width*k)/2,(H-im.height*k)/2,im.width*k,im.height*k);
    URL.revokeObjectURL(u);c.img=cv.toDataURL('image/jpeg',.85);save();const b=$('#ptr');if(b)b.innerHTML=ptrIn(c);toast('Retrato atualizado')};
  im.onerror=()=>{URL.revokeObjectURL(u);toast('Não foi possível ler a imagem')};im.src=u});
function exportChar(id){const c=S.chars.find(x=>x.id===id);if(!c)return;
  const nm=((c.name||'personagem').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'-').replace(/^-+|-+$/g,''))||'personagem';
  const blob=new Blob([JSON.stringify({app:'candela-obscura-ficha',v:1,char:c},null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='ficha-'+nm+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Ficha exportada')}
function normChar(o){if(!o||typeof o!=='object'||!(o.dr||o.ac))throw new Error('formato');
  const c=Object.assign(mk(),o),str=k=>{c[k]=typeof c[k]==='string'?c[k]:''};
  c.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  if(typeof c.img!=='string'||!/^data:image\/(jpeg|png|webp|gif);base64,/.test(c.img)||c.img.length>400000)c.img='';
  ['name','pron','circle','style','trig','quest','role','spec','eqc','notes'].forEach(str);
  c.dr={};D.forEach(([d])=>{const x=(o.dr&&o.dr[d])||{},mx=Math.max(0,Math.min(9,+x.max||0));c.dr[d]={max:mx,cur:Math.max(0,Math.min(mx,+x.cur||0)),r:[0,1,2].map(i=>x.r&&x.r[i]?1:0)}});
  c.mk=Object.assign({c:0,m:0,s:0},o.mk);['c','m','s'].forEach(k=>{c.mk[k]=Math.max(0,Math.min(3,+c.mk[k]||0))});
  ['ac','gold','ab','opt'].forEach(k=>{if(!c[k]||typeof c[k]!=='object'||Array.isArray(c[k]))c[k]={}});
  ['eq','ks','scx'].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[]});
  c.sc=[0,1,2].map(i=>String((o.sc||[])[i]||''));c.rel=Array.from({length:8},(_,i)=>String((o.rel||[])[i]||''));
  if(!SP.some(x=>x.n===c.spec))c.spec='';if(!R[c.role]){c.role='';c.spec=''}
  return c}
$('#imp-file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),c=normChar(j&&j.char?j.char:j);S.chars.push(c);save();if((location.hash.slice(1)||'inicio')!=='inicio')location.hash='inicio';else render(true);toast('Ficha “'+(c.name||'Sem nome')+'” importada')}catch(err){toast('Arquivo inválido: não é uma ficha exportada')}};
  r.onerror=()=>toast('Não foi possível ler o arquivo');r.readAsText(f)});
render(true);
</script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
const PFX='candela-obscura-vtt-',LS=localStorage;
const VT={role:'off',peer:null,conns:[],gm:null,code:'',pl:{},who:[],log:[],scene:null,music:null,vol:+(LS.getItem('co-vol')||.5),mute:false,blocked:false,lib:{imgs:[],tracks:[]},pre:'',last:'',min:LS.getItem('co-min')==='1'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const idb=(m,f)=>new Promise((ok,no)=>{const r=indexedDB.open('co-gm',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>{const tx=r.result.transaction('k',m),q=f(tx.objectStore('k'));tx.oncomplete=()=>ok(q&&q.result);tx.onerror=()=>no(tx.error)};r.onerror=()=>no(r.error)});
const saveLib=()=>idb('readwrite',s=>s.put(VT.lib,'lib')).catch(()=>toast('Não foi possível salvar a biblioteca neste navegador'));
idb('readonly',s=>s.get('lib')).then(l=>{if(l){VT.lib=l;if(location.hash==='#mestre')render()}}).catch(()=>{});
const bc=m=>VT.conns.forEach(c=>c.open&&c.send(m));
const snap=c=>{const o=JSON.parse(JSON.stringify(c));o.notes='';return o};
const noPeer=()=>typeof Peer==='undefined'&&(toast('A biblioteca de conexão não carregou (é preciso internet)'),true);

/* ---------- rolagens compartilhadas ---------- */
const rollH=e=>`<div class="re"><div class="rh"><b>${esc(e.who)}</b> · ${esc(e.act)} <small>${esc(e.drv)}${e.gold?' · ◆':''}</small></div><div class="dice">${e.d.map((o,i)=>`<div class="dw"><i class="die sm ${o.g?'gl':''} ${o.v===e.fin?'k':'dim'}" style="--n:${i}">${face(o.v)}</i>${o.g?'<em class="gb">dourado</em>':''}</div>`).join('')}</div><div class="res ${e.q}">${esc(e.l)}${e.rec?' · +1 motivação':''}</div></div>`;
function addRoll(e,mine,quiet){if(VT.log.some(x=>x.id===e.id))return;VT.log.push(e);if(VT.log.length>60)VT.log.shift();
  const r=$('#rolls');if(r){const n=r.querySelector('.cnote');if(n)n.remove();r.insertAdjacentHTML('afterbegin',rollH(e))}else if(!mine&&!quiet)toast(`${e.who}: ${e.act} — ${e.l}`);
  if(mine){if(VT.role==='player'&&VT.gm&&VT.gm.open)VT.gm.send({t:'roll',e});else if(VT.role==='gm')bc({t:'roll',e})}}
const _fin=fin;
fin=function(R0,pick,c){_fin(R0,pick,c);try{addRoll({id:uid(),who:c.name||'Sem nome',act:RL.n,drv:RL.d,gold:!!c.gold[RL.n],d:R0.d.map(o=>({v:o.v,g:o.g})),fin:R0.fin,l:R0.l,q:R0.q,rec:R0.rec},true)}catch(e){}};

/* ---------- cena e música ---------- */
const Z={s:1,x:0,y:0,p:new Map(),d:0,t:0};
const stageH=()=>VT.scene&&VT.scene.src?`<div id="zm" class="zm"><img src="${esc(VT.scene.src)}" alt="" draggable="false"></div><div class="stb"><button data-vt="zin" aria-label="Aproximar">+</button><button data-vt="zout" aria-label="Afastar">−</button><button data-vt="zrst" aria-label="Ajustar à tela">⟲</button><button data-vt="fs" aria-label="Tela cheia">⛶</button></div>`:'<div class="empty">A cena ainda não foi revelada…</div>';
function setScene(s){VT.scene=s;const st=$('#stage');Z.s=1;Z.x=Z.y=0;Z.p.clear();if(st){st.innerHTML=stageH();st.style.touchAction='pan-y'}}
const aud=new Audio();aud.loop=true;
const yp=(f,a)=>{const i=$('#vt-yt iframe');if(i&&i.contentWindow)i.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:a||[]}),'*')};
const vol=()=>{aud.volume=VT.vol;aud.muted=VT.mute;yp('setVolume',[Math.round(VT.vol*100)]);yp(VT.mute?'mute':'unMute')};
function mini(){const el=$('#vt-mini'),m=VT.music;el.hidden=!(m&&m.on);if(el.hidden)return;el.classList.toggle('min',VT.min);el.querySelector('.mn').textContent=VT.min?'♪':'–';el.querySelector('.t').textContent='♪ '+(m.title||'Trilha');el.querySelector('input').value=VT.vol*100;el.querySelector('.mu').textContent=VT.mute?'Ativar som':'Silenciar';el.querySelector('.go').hidden=!VT.blocked}
function applyMusic(m){VT.music=m;aud.pause();if(aud.src&&aud.src.startsWith('blob:'))URL.revokeObjectURL(aud.src);aud.removeAttribute('src');$('#vt-yt').innerHTML='';VT.blocked=false;
  if(m&&m.on){if(m.kind==='yt'){$('#vt-yt').innerHTML=`<iframe width="160" height="90" allow="autoplay" src="https://www.youtube.com/embed/${encodeURIComponent(m.id)}?autoplay=1&loop=1&playlist=${encodeURIComponent(m.id)}&controls=0&enablejsapi=1&playsinline=1"></iframe>`;$('#vt-yt iframe').onload=vol}
  else{aud.src=m.kind==='file'?URL.createObjectURL(new Blob([m.buf],{type:m.mime||'audio/mpeg'})):m.src;vol();aud.play().catch(()=>{VT.blocked=true;mini()})}}
  mini()}

/* ---------- rede (PeerJS, sem servidor próprio) ---------- */
const connH=()=>VT.role==='off'?`<b style="font-family:Cinzel,serif">Entrar na sala</b><input id="vt-code" type="text" placeholder="Código" maxlength="8" value="${esc(VT.pre)}" style="max-width:110px;text-transform:uppercase"><input id="vt-name" type="text" placeholder="Seu nome" value="${esc((C()&&C().name)||'')}"><button class="btn" data-vt="join">Conectar</button><span class="cnote">Mestre? <a href="#mestre" style="color:var(--g)">Crie a sala aqui</a>.</span>`
 :VT.role==='gm'?`<span>Você é o mestre da sala <b>${VT.code}</b> · ${VT.who.length} jogador(es) conectado(s)</span><a href="#mestre" style="color:var(--g)">Painel do mestre</a>`
 :`<span>Conectado à sala <b>${VT.code}</b>${VT.who.length?' · Na sala: '+VT.who.map(esc).join(', '):''}</span><button class="btn" data-vt="leave">Sair</button>`;
const roomH=()=>VT.role==='gm'?`<h3>Sala</h3><div class="code">${VT.code}</div><p>Mande este link aos jogadores no Discord:<br><small>${esc(location.origin+location.pathname+'?sala='+VT.code)}</small></p><button class="btn" data-vt="copy">Copiar link</button> <button class="btn" data-vt="clearlog">Limpar rolagens</button> <a class="btn" href="#cena" style="text-decoration:none;display:inline-block">Ver a cena</a> <button class="btn" data-vt="leave">Encerrar sala</button>`
 :VT.role==='player'?`<h3>Sala</h3><p>Você está conectado como jogador. Saia da sala para criar uma nova.</p><button class="btn" data-vt="leave">Sair</button>`
 :`<h3>Sala</h3><p>Crie uma sala e mande o link aos jogadores pelo Discord. Não precisa instalar nada nem abrir portas.</p><button class="btn" data-vt="host">Criar sala</button>`;
const refresh=()=>{const a=$('#vt-cena');if(a)a.classList.toggle('live',VT.role!=='off');const c=$('.conn'),r=$('#vt-room'),p=$('#vt-pl');if(c)c.innerHTML=connH();if(r)r.innerHTML=roomH();if(p)p.innerHTML=plAll()};
function who(){VT.who=Object.values(VT.pl).filter(p=>p.on).map(p=>p.name);bc({t:'who',n:VT.who});refresh()}
function host(){if(noPeer())return;const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>AL[b%AL.length]).join(''),p=new Peer(PFX+code);VT.peer=p;
  p.on('open',()=>{VT.role='gm';VT.code=code;LS.setItem('co-room',code);refresh();toast('Sala criada: '+code)});
  p.on('connection',c=>{c.on('data',d=>gmData(c,d));c.on('close',()=>gone(c));c.on('error',()=>gone(c))});
  p.on('error',e=>{if(e.type==='unavailable-id'){LS.removeItem('co-room');try{p.destroy()}catch(x){}toast('Código em uso, gerando outro…');setTimeout(host,300)}else toast('Erro de rede: '+e.type)})}
function gmData(c,d){if(!d||!d.t)return;
  if(d.t==='hi'){if(!VT.conns.includes(c))VT.conns.push(c);Object.keys(VT.pl).forEach(k=>{if(k!==c.peer&&!VT.pl[k].on&&VT.pl[k].name===d.name)delete VT.pl[k]});VT.pl[c.peer]={name:d.name,char:d.char,on:true,conn:c};c.send({t:'init',scene:VT.scene,music:VT.music,log:VT.log});who();upd(c.peer)}
  else if(d.t==='sheet'&&VT.pl[c.peer]){VT.pl[c.peer].char=d.char;upd(c.peer)}
  else if(d.t==='roll'){addRoll(d.e,false);bc({t:'roll',e:d.e})}}
function gone(c){VT.conns=VT.conns.filter(x=>x!==c);if(VT.pl[c.peer]){VT.pl[c.peer].on=false;upd(c.peer)}who()}
function join(){const code=($('#vt-code').value||'').trim().toUpperCase(),name=($('#vt-name').value||'').trim()||'Jogador';if(!code)return toast('Digite o código da sala');if(noPeer())return;
  leave(true);const p=new Peer();VT.peer=p;
  const to=setTimeout(()=>{toast('Não consegui conectar. Confira o código e a internet.');leave(true)},12000);
  p.on('open',()=>{const c=p.connect(PFX+code,{reliable:true});VT.gm=c;
    c.on('open',()=>{clearTimeout(to);VT.role='player';VT.code=code;const ch=C();VT.last=ch?JSON.stringify(snap(ch)):'';c.send({t:'hi',name,char:ch?snap(ch):null});refresh();toast('Conectado à sala '+code)});
    c.on('data',playerData);c.on('close',()=>{if(VT.role==='player'){toast('A conexão com o mestre foi encerrada');leave(true)}})});
  p.on('error',e=>{clearTimeout(to);toast(e.type==='peer-unavailable'?'Sala não encontrada. Confira o código.':'Erro de rede: '+e.type);leave(true)})}
function playerData(d){if(!d||!d.t)return;
  if(d.t==='init'){setScene(d.scene);(d.log||[]).forEach(e=>addRoll(e,false,true));applyMusic(d.music)}
  else if(d.t==='scene')setScene(d.s);else if(d.t==='music')applyMusic(d.m);else if(d.t==='roll')addRoll(d.e,false);
  else if(d.t==='clearlog'){VT.log=[];const r=$('#rolls');if(r)r.innerHTML=''}
  else if(d.t==='who'){VT.who=d.n;refresh()}
  else if(d.t==='kick'){toast('Você foi removido da sala pelo mestre');leave(true)}}
function leave(silent){const was=VT.role;if(VT.peer){try{VT.peer.destroy()}catch(e){}}VT.peer=null;VT.conns=[];VT.gm=null;VT.role='off';VT.pl={};VT.who=[];if(was!=='off')applyMusic(null);refresh();if(!silent&&was!=='off')toast('Você saiu da sala')}
setInterval(()=>{if(VT.role!=='player'||!VT.gm||!VT.gm.open)return;const c=C();if(!c)return;const j=JSON.stringify(snap(c));if(j!==VT.last){VT.last=j;VT.gm.send({t:'sheet',char:JSON.parse(j)})}},2000);

/* ---------- página da cena (todos) ---------- */
function cena(){return `<div class="wrap vt cen"><div class="conn">${connH()}</div><div class="cgrid" style="--rw:${LS.getItem('co-rw')??300}px"><div class="stage" id="stage">${stageH()}</div><div class="split" id="split" title="Arraste para ajustar a largura (duplo clique restaura)"></div><div class="rcol"><h3 style="font-size:20px;margin-bottom:8px">Rolagens</h3><div class="rolls" id="rolls">${VT.log.slice().reverse().map(rollH).join('')||'<div class="cnote">Nenhuma rolagem ainda. Role uma ação na sua ficha e ela aparece aqui.</div>'}</div></div></div></div>`}

/* ---------- painel do mestre ---------- */
const rs=c=>D.map(([d])=>{const x=c.dr[d],t=Math.floor(x.max/3),b=x.r.slice(0,t).filter(Boolean).length;return{d,cur:x.cur,max:x.max,t,b}});
function plCard(id){const p=VT.pl[id],c=p.char;if(!c)return `<div class="pc off" id="pc-${id}"><button class="kx" data-vt="kick" data-id="${id}" aria-label="Remover jogador" title="Remover da sala">×</button><b>${esc(p.name)}</b><small>sem ficha aberta</small></div>`;const k=c.mk||{c:0,m:0,s:0};
  return `<div class="pc ${p.on?'':'off'}" id="pc-${id}" data-vt="view" data-id="${id}"><button class="kx" data-vt="kick" data-id="${id}" aria-label="Remover jogador" title="Remover da sala">×</button>${c.img?`<img class="pth" src="${esc(c.img)}" alt="">`:''}<b>${esc(c.name||p.name)}</b><small>${esc(p.name)}${c.role?' · '+esc(c.role)+(c.spec?' / '+esc(c.spec):''):''}${p.on?'':' · offline'}</small>${rs(c).map(x=>`<div class="pd"><span>${x.d}</span><span>${x.cur}/${x.max}</span><span>${'▽'.repeat(x.t-x.b)+'▼'.repeat(x.b)}</span></div>`).join('')}<div class="pm"><span>Corpo ${k.c}/3</span><span>Mente ${k.m}/3</span><span>Sangria ${k.s}/3</span></div><small>Cicatrizes: ${(c.sc||[]).filter((s,i)=>s||(c.scx&&c.scx[i])).length}/3</small></div>`}
const plAll=()=>Object.keys(VT.pl).map(plCard).join('')||'<div class="cnote">Ninguém conectado ainda. Envie o link da sala aos jogadores.</div>';
function upd(id){const el=document.getElementById('pc-'+id),l=$('#vt-pl');if(!l)return;if(el)el.outerHTML=plCard(id);else l.innerHTML=plAll()}
function viewH(id){const p=VT.pl[id],c=p&&p.char;if(!c)return '<div class="mod"><h2>Sem ficha</h2><div class="row"><button class="btn" data-a="close">Fechar</button></div></div>';
  const sel=SP.find(s=>s.n===c.spec),eq=BASE.concat(sel?sel.e:[]).filter((n,i)=>c.eq&&c.eq[i]).concat(c.eq&&c.eq[6]&&c.eqc?[c.eqc]:[]),ab=(AB2[c.role]||[]).concat(AB2[c.spec]||[]).filter(([n])=>c.ab&&c.ab[n]),
  ac=Object.entries(c.ac||{}).filter(([,v])=>v>0).map(([k,v])=>`${c.gold&&c.gold[k]?'◆ ':''}${k} ${v}`).join(' · '),k=c.mk||{c:0,m:0,s:0};
  return `<div class="mod"><h2>${esc(c.name||p.name)}</h2><p class="cnote">${esc(p.name)} · ${esc(c.role||'sem papel')}${c.spec?' / '+esc(c.spec):''}${c.pron?' · '+esc(c.pron):''}</p>${['style','trig','quest'].map((f,i)=>c[f]?`<p><b>${['Estilo','Estopim','Pergunta'][i]}:</b> ${esc(c[f])}</p>`:'').join('')}<p><b>Ações:</b> ${esc(ac)||'—'}</p><p><b>Impulsos:</b> ${rs(c).map(x=>`${x.d} ${x.cur}/${x.max} (resistência ${x.t-x.b}/${x.t})`).join(' · ')}</p><p><b>Marcas:</b> Corpo ${k.c}/3 · Mente ${k.m}/3 · Sangria ${k.s}/3</p><p><b>Cicatrizes:</b> ${(c.sc||[]).filter(Boolean).map(esc).join('; ')||'—'}</p><p><b>Equipamento:</b> ${eq.map(esc).join(', ')||'—'}</p><p><b>Relações:</b> ${(c.rel||[]).filter(Boolean).map(esc).join(' · ')||'—'}</p><h3 style="margin-top:12px;font-size:18px">Habilidades</h3>${ab.map(([n,t])=>`<p><b>${n}:</b> ${t}</p>`).join('')||'<p class="cnote">Nenhuma marcada.</p>'}<div class="row"><button class="btn" data-a="close">Fechar</button></div></div>`}
const libH=()=>{const L=VT.lib,m=VT.music;return `<div class="pn"><h3>Imagens</h3><div class="bar2"><button class="btn" data-vt="addimg">Adicionar imagens</button><input id="vt-url" type="text" placeholder="…ou cole o link de uma imagem"><button class="btn" data-vt="urlimg">Adicionar link</button><button class="btn" data-vt="hide">Esconder cena</button></div><div class="tg">${L.imgs.map(i=>`<div class="tt ${VT.scene&&VT.scene.id===i.id?'on':''}" data-vt="show" data-id="${i.id}" title="Mostrar para todos"><img src="${esc(i.th)}" alt=""><span>${esc(i.title)}</span><button data-vt="delimg" data-id="${i.id}" aria-label="Remover">×</button></div>`).join('')||'<div class="cnote">Arraste imagens para esta página ou use o botão. Um clique na miniatura mostra a imagem para todos.</div>'}</div></div>
<div class="pn"><h3>Trilha sonora</h3><div class="bar2"><input id="vt-tl" type="text" placeholder="Link do YouTube ou de um áudio (.mp3)"><input id="vt-tt" type="text" placeholder="Nome (opcional)" style="max-width:170px"><button class="btn" data-vt="addtr">Adicionar</button><button class="btn" data-vt="addaud">Enviar arquivo de áudio</button><button class="btn" data-vt="stopm">Parar música</button></div>${L.tracks.map(t=>`<div class="tr ${m&&m.on&&m.tid===t.id?'on':''}"><button class="btn" data-vt="play" data-id="${t.id}" title="Tocar para todos">▶</button><span>${esc(t.title)}</span><small>${t.kind==='yt'?'YouTube':t.kind==='file'?'arquivo':'link'}</small><button data-vt="deltr" data-id="${t.id}" aria-label="Remover">×</button></div>`).join('')||'<div class="cnote">Nenhuma faixa ainda. Arquivos de áudio são enviados aos jogadores quando você toca (até 12 MB).</div>'}</div>`};
const redo=()=>{const g=$('#vt-lib');if(g)g.innerHTML=libH()};
function mestre(){return `<div class="wrap vt"><div class="hero"><h1>Mestre</h1><p>Crie a sala, acompanhe as fichas e conduza a cena com poucos cliques.</p></div><div class="pn" id="vt-room">${roomH()}</div><div class="pn"><h3>Jogadores <button class="btn" data-vt="clroff" style="font-size:12px;float:right" title="Remove da lista quem está offline">Limpar offline</button></h3><div class="pgrid" id="vt-pl">${plAll()}</div></div><div id="vt-lib">${libH()}</div></div>`}
window.VTT={cena,mestre};

/* ---------- ações (cliques) ---------- */
const hostOnly=()=>VT.role!=='player';
document.addEventListener('click',e=>{if(e.target.closest('nav a')){const n=$('#nav');n&&n.classList.remove('open')}const t=e.target.closest('[data-vt]');if(!t)return;const a=t.dataset.vt,id=t.dataset.id,L=VT.lib;
  switch(a){
  case'menu':{const n=$('#nav');n.classList.toggle('open');t.setAttribute('aria-expanded',n.classList.contains('open'))}break;
  case'min':VT.min=!VT.min;LS.setItem('co-min',VT.min?'1':'0');mini();break;
  case'kick':{const k=VT.pl[id];if(!k)break;if(k.on&&k.conn)openM(`<div class="mod"><h2>Remover jogador?</h2><p>${esc(k.name)} será desconectado da sala.</p><div class="row"><button class="btn" data-vt="kickok" data-id="${id}">Remover</button><button class="btn" data-a="close">Cancelar</button></div></div>`);else{delete VT.pl[id];who()}break}
  case'kickok':{const k=VT.pl[id];if(k&&k.conn){const c=k.conn;try{c.send({t:'kick'})}catch(x){}setTimeout(()=>{try{c.close()}catch(x){}},300);VT.conns=VT.conns.filter(x=>x!==c)}delete VT.pl[id];closeM();who();break}
  case'clroff':Object.keys(VT.pl).forEach(k=>{if(!VT.pl[k].on)delete VT.pl[k]});who();break;
  case'zin':Z.s*=1.4;zap();break;case'zout':Z.s/=1.4;zap();break;case'zrst':zreset();break;
  case'fs':{const st=$('#stage');if(document.fullscreenElement)document.exitFullscreen();else if(st&&st.requestFullscreen)st.requestFullscreen().catch(()=>toast('Tela cheia indisponível neste navegador'));break}
  case'host':host();break;case'join':join();break;case'leave':leave();break;
  case'copy':{const u=location.origin+location.pathname+'?sala='+VT.code;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copiado'),()=>prompt('Copie o link:',u));break}
  case'clearlog':VT.log=[];bc({t:'clearlog'});{const r=$('#rolls');if(r)r.innerHTML=''}toast('Rolagens limpas');break;
  case'view':openM(viewH(id));break;
  case'addimg':$('#vt-img').click();break;
  case'urlimg':{const u=$('#vt-url').value.trim();if(!/^https?:\/\//.test(u))return toast('Cole um link de imagem que comece com http');L.imgs.push({id:uid(),title:(decodeURIComponent(u.split('/').pop().split('?')[0])||'Imagem').replace(/\.\w+$/,''),src:u,th:u});saveLib();redo();break}
  case'show':{const i=L.imgs.find(x=>x.id===id);if(i){const s={id:i.id,src:i.src,title:i.title};setScene(s);bc({t:'scene',s});redo()}break}
  case'hide':setScene(null);bc({t:'scene',s:null});redo();break;
  case'delimg':L.imgs=L.imgs.filter(x=>x.id!==id);if(VT.scene&&VT.scene.id===id){setScene(null);bc({t:'scene',s:null})}saveLib();redo();break;
  case'addtr':{const u=$('#vt-tl').value.trim(),n=$('#vt-tt').value.trim(),y=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
    if(y)L.tracks.push({id:uid(),kind:'yt',src:y[1],title:n||'YouTube '+y[1]});
    else if(/^https?:\/\//.test(u))L.tracks.push({id:uid(),kind:'url',src:u,title:n||decodeURIComponent(u.split('/').pop().split('?')[0])||'Áudio'});
    else return toast('Cole um link do YouTube ou de um arquivo de áudio');saveLib();redo();break}
  case'addaud':$('#vt-aud').click();break;
  case'deltr':L.tracks=L.tracks.filter(x=>x.id!==id);saveLib();redo();break;
  case'play':{const k=L.tracks.find(x=>x.id===id);if(!k)break;const m={kind:k.kind,title:k.title,on:true,id:k.src,src:k.src,buf:k.data,mime:k.mime,tid:k.id};applyMusic(m);bc({t:'music',m});if(k.kind==='file'&&VT.conns.length)toast('Enviando o áudio aos jogadores…');redo();break}
  case'stopm':{const m={on:false};applyMusic(m);bc({t:'music',m});redo();break}
  case'mute':VT.mute=!VT.mute;vol();mini();break;
  case'unblock':aud.play().then(()=>{VT.blocked=false;mini()}).catch(()=>{});break}});
const small=(f,mx,q)=>new Promise(ok=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const sz=(m,q)=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};const r={id:uid(),title:f.name.replace(/\.\w+$/,''),src:sz(1600,.82),th:sz(240,.7)};URL.revokeObjectURL(u);ok(r)};im.onerror=()=>{URL.revokeObjectURL(u);ok(null)};im.src=u});
async function addFiles(files){let n=0;for(const f of files){if(f.type.startsWith('image/')){const r=await small(f);if(r){VT.lib.imgs.push(r);n++}}else if(f.type.startsWith('audio/')){if(f.size>12e6){toast('Áudio acima de 12 MB: use um link do YouTube'+' ou comprima o arquivo');continue}VT.lib.tracks.push({id:uid(),kind:'file',title:f.name.replace(/\.\w+$/,''),data:await f.arrayBuffer(),mime:f.type});n++}}
  if(n){await saveLib();redo();toast(n+' item(ns) adicionado(s)')}}
document.body.insertAdjacentHTML('beforeend','<input type="file" id="vt-img" accept="image/*" multiple hidden><input type="file" id="vt-aud" accept="audio/*" hidden><div id="vt-mini" hidden><button class="mn" data-vt="min" aria-label="Minimizar ou expandir o player">–</button><span class="t"></span><input type="range" min="0" max="100" aria-label="Volume"><button class="mu" data-vt="mute"></button><button class="go" data-vt="unblock" hidden>Ativar música</button><div id="vt-yt"></div></div>');
['#vt-img','#vt-aud'].forEach(s=>$(s).addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''}));
$('#vt-mini input').addEventListener('input',e=>{VT.vol=e.target.value/100;LS.setItem('co-vol',VT.vol);vol()});
addEventListener('dragover',e=>{if(location.hash==='#mestre')e.preventDefault()});
addEventListener('drop',e=>{if(location.hash==='#mestre'&&e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();addFiles([...e.dataTransfer.files])}});
const q=new URLSearchParams(location.search).get('sala');if(q){VT.pre=q.toUpperCase();if(location.hash!=='#cena')location.hash='cena'}
const zap=()=>{const z=$('#zm'),st=$('#stage');if(!z||!st)return;if(Z.s<=1){Z.s=1;Z.x=Z.y=0}else{Z.s=Math.min(Z.s,6);const mx=st.clientWidth*(Z.s-1)/2,my=st.clientHeight*(Z.s-1)/2;Z.x=Math.max(-mx,Math.min(mx,Z.x));Z.y=Math.max(-my,Math.min(my,Z.y))}z.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;st.style.touchAction=Z.s>1?'none':'pan-y'};
const zreset=()=>{Z.s=1;Z.x=Z.y=0;Z.p.clear();zap()};
document.addEventListener('pointerdown',e=>{const st=e.target.closest('#stage');if(!st||e.target.closest('button'))return;Z.p.set(e.pointerId,{x:e.clientX,y:e.clientY});try{st.setPointerCapture(e.pointerId)}catch(x){}
  if(Z.p.size===1){const n=Date.now();if(n-Z.t<300){if(Z.s>1)zreset();else{Z.s=2.5;zap()}Z.t=0}else Z.t=n}
  if(Z.p.size===2){const[a,b]=[...Z.p.values()];Z.d=Math.hypot(a.x-b.x,a.y-b.y)}});
document.addEventListener('pointermove',e=>{if(!Z.p.has(e.pointerId))return;const o=Z.p.get(e.pointerId),n={x:e.clientX,y:e.clientY};Z.p.set(e.pointerId,n);
  if(Z.p.size===2){const[a,b]=[...Z.p.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(Z.d>0)Z.s*=d/Z.d;Z.d=d;Z.x+=(n.x-o.x)/2;Z.y+=(n.y-o.y)/2;zap()}
  else if(Z.s>1){Z.x+=n.x-o.x;Z.y+=n.y-o.y;zap()}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,e=>{Z.p.delete(e.pointerId);Z.d=0}));
document.addEventListener('wheel',e=>{if(!e.target.closest('#stage'))return;e.preventDefault();Z.s*=e.deltaY<0?1.15:1/1.15;zap()},{passive:false});
document.addEventListener('pointerdown',e=>{const sp=e.target.closest('#split');if(!sp)return;const g=sp.parentElement;sp.setPointerCapture(e.pointerId);
  const mv=ev=>{const r=g.getBoundingClientRect();g.style.setProperty('--rw',Math.max(0,Math.min(640,r.right-ev.clientX-6))+'px')},up=()=>{sp.removeEventListener('pointermove',mv);sp.removeEventListener('pointerup',up);LS.setItem('co-rw',parseInt(g.style.getPropertyValue('--rw'))||0)};
  sp.addEventListener('pointermove',mv);sp.addEventListener('pointerup',up);e.preventDefault()});
document.addEventListener('dblclick',e=>{const sp=e.target.closest('#split');if(sp){sp.parentElement.style.setProperty('--rw','300px');LS.setItem('co-rw',300)}});
addEventListener('hashchange',()=>{const n=$('#nav');n&&n.classList.remove('open')});
refresh();render();
})();
