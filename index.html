  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --parchment: #f3ede0;
      --parchment-mid: #e8dfc9;
      --parchment-dark: #dacdb2;
      --ink: #161412;
      --ink-soft: #3a342e;
      --gold: #a97c28;
      --gold-bright: #cfa042;
      --crimson: #741b1b;
    }

    body {
      background-color: #110f0d;
      background-image: radial-gradient(circle at 50% 0%, #241e18 0%, #0f0d0c 80%);
      color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
    }

    .font-display {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.06em;
    }

    .font-ui {
      font-family: 'Inter', sans-serif;
    }

    /* Official Sheet Parchment & Art Nouveau Framing */
    .sheet-paper {
      background-color: var(--parchment);
      background-image:
        radial-gradient(rgba(169, 124, 40, 0.05) 1px, transparent 0),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.35), rgba(218, 205, 178, 0.35));
      background-size: 22px 22px, 100% 100%;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.75),
        inset 0 0 0 2px var(--ink),
        inset 0 0 0 5px var(--parchment),
        inset 0 0 0 6.5px var(--ink);
      color: var(--ink);
      position: relative;
    }

    .sheet-header-bar {
      background-color: var(--ink);
      color: var(--parchment);
      font-family: 'Cinzel', serif;
      letter-spacing: 0.09em;
    }

    .sheet-input {
      background: transparent;
      border-bottom: 1.5px solid #2e2925;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--ink);
      padding: 1px 4px;
      width: 100%;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .sheet-input:focus {
      outline: none;
      border-bottom-color: var(--gold);
      background-color: rgba(169, 124, 40, 0.08);
    }

    /* Diamond Gilded / Ability Toggle */
    .diamond-check {
      width: 12px;
      height: 12px;
      border: 1.6px solid var(--ink);
      transform: rotate(45deg);
      display: inline-block;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
      background: transparent;
    }
    .diamond-check.gilded {
      background-color: var(--gold-bright);
      border-color: #5c400c;
      box-shadow: 0 0 5px rgba(207, 160, 66, 0.7);
    }
    .diamond-check.checked {
      background-color: var(--ink);
    }

    /* Action Rating Dots */
    .action-dot {
      width: 14px;
      height: 14px;
      border-radius: 9999px;
      border: 1.7px solid var(--ink);
      display: inline-block;
      cursor: pointer;
      transition: all 0.12s ease;
      background: transparent;
    }
    .action-dot.filled {
      background-color: var(--ink);
    }
    .action-dot.preset-base {
      box-shadow: 0 0 0 1.5px var(--gold);
    }

    /* Drive Track (9 cells in 3 groups of 3) */
    .drive-cell {
      width: 11px;
      height: 17px;
      border: 1.4px solid var(--ink);
      cursor: pointer;
      transition: all 0.12s;
      background: var(--parchment);
    }
    .drive-cell.active {
      background-color: var(--ink);
    }
    .drive-max-cell {
      width: 11px;
      height: 6px;
      border: 1.4px solid var(--ink);
      border-top: none;
      cursor: pointer;
      transition: all 0.12s;
      background: var(--parchment);
    }
    .drive-max-cell.active {
      background-color: var(--gold);
    }
    .drive-max-cell.preset-base {
      background-color: #6b4c12;
    }

    /* Marks Circles */
    .mark-dot {
      width: 17px;
      height: 17px;
      border-radius: 9999px;
      border: 1.8px solid var(--ink);
      cursor: pointer;
      transition: all 0.15s;
    }
    .mark-dot.filled {
      background-color: var(--crimson);
      border-color: #420c0c;
    }

    /* Gear Square Checkbox */
    .gear-box {
      width: 14px;
      height: 14px;
      border: 1.6px solid var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: transparent;
    }
    .gear-box.checked {
      background-color: var(--ink);
    }

    /* Sub-option Pill */
    .sub-option-pill {
      display: inline-block;
      padding: 0px 5px;
      margin: 0 1px;
      border-radius: 9999px;
      border: 1.2px solid transparent;
      cursor: pointer;
      transition: all 0.12s;
    }
    .sub-option-pill:hover {
      border-color: var(--gold);
    }
    .sub-option-pill.circled {
      border-color: var(--crimson);
      background-color: rgba(116, 27, 27, 0.12);
      font-weight: 700;
    }

    /* Dice Roll 3D Tumble Animation */
    @keyframes diceTumble {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(0.7); opacity: 0.4; }
      35% { transform: rotateX(200deg) rotateY(140deg) rotateZ(-60deg) scale(1.12); opacity: 1; }
      70% { transform: rotateX(-90deg) rotateY(280deg) rotateZ(40deg) scale(0.95); }
      100% { transform: rotateX(0deg) rotateY(360deg) rotateZ(0deg) scale(1); }
    }
    .dice-rolling {
      animation: diceTumble 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .sheet-paper { box-shadow: none; margin: 0; width: 100%; }
    }
  </style>
</head>

      applySpecialtyDefaultsToCharacter(charObj, specKey) {
        const spec = SPECIALTIES_DATA[specKey] || SPECIALTIES_DATA.journalist;

        charObj.specialty = specKey;

          nerve: spec.startingDrives.nerve || 0,
          cunning: spec.startingDrives.cunning || 0,
          intuition: spec.startingDrives.intuition || 0

        charObj.drives = {
          nerve: { current: drivesMax.nerve, max: drivesMax.nerve, burned: [false, false, false] },

          intuition: { current: drivesMax.intuition, max: drivesMax.intuition, burned: [false, false, false] }

        const defaultRoleAb = role.abilities[0]?.id;
        const defaultSpecAb = spec.abilities[0]?.id;
        charObj.selectedAbilities = [defaultRoleAb, defaultSpecAb].filter(Boolean);

      /* ========================================================================
         VIEW 2: CHARACTER CREATION WIZARD
         ======================================================================== */
      startWizard() {
        this.wizardState = {
          specialty: "journalist",
          zeroToOneAction: "move",
          freePoints: { move: 0, strike: 0, control: 0, sway: 0, read: 0, hide: 0, survey: 0, focus: 0, sense: 0 },
          bonusDrives: { nerve: 2, cunning: 2, intuition: 2 },
          extraGilded: "read",
          roleAbility: "iknowaguy",
          specAbility: "insideraccess",
          name: "",
          pronouns: "",
          circle: "",
          style: "",
          catalyst: "",
          question: "",
          relName: "",
          relArchetype: I18N[this.lang].relationshipArchetypes[0]
        };
        this.navigate("wizard");
      },

      setWizardSpecialty(specKey) {
        const spec = SPECIALTIES_DATA[specKey];
        const role = ROLES_DATA[spec.role];
        this.wizardState.specialty = specKey;
        this.wizardState.freePoints = { move: 0, strike: 0, control: 0, sway: 0, read: 0, hide: 0, survey: 0, focus: 0, sense: 0 };
        const allActs = ["move", "strike", "control", "sway", "read", "hide", "survey", "focus", "sense"];
        const zeroActs = allActs.filter(a => !(spec.startingActions[a] > 0));
        this.wizardState.zeroToOneAction = zeroActs[0] || "move";
        const nonGilded = allActs.filter(a => !spec.startingGilded.includes(a));
        this.wizardState.extraGilded = nonGilded[0] || "move";
        this.wizardState.roleAbility = role.abilities[0]?.id || "";
        this.wizardState.specAbility = spec.abilities[0]?.id || "";
        this.renderWizard();
      },

      adjustWizFreeAction(actKey, delta) {
        const ws = this.wizardState;
        const spec = SPECIALTIES_DATA[ws.specialty];
        const base = (spec.startingActions[actKey] || 0) + (ws.zeroToOneAction === actKey ? 1 : 0);
        const currentFree = ws.freePoints[actKey] || 0;
        const totalFreeUsed = Object.values(ws.freePoints).reduce((a, b) => a + b, 0);

        if (delta > 0) {
          if (totalFreeUsed >= 3) return;
          if (base + currentFree >= 2) return;
          ws.freePoints[actKey] = currentFree + 1;
        } else {
          if (currentFree <= 0) return;
          ws.freePoints[actKey] = currentFree - 1;
        }
        this.renderWizard();
      },

      adjustWizDrive(driveKey, delta) {
        const ws = this.wizardState;
        const spec = SPECIALTIES_DATA[ws.specialty];
        const base = spec.startingDrives[driveKey] || 0;
        const currentAdd = ws.bonusDrives[driveKey] || 0;
        const totalUsed = Object.values(ws.bonusDrives).reduce((a, b) => a + b, 0);

        if (delta > 0) {
          if (totalUsed >= 6) return;
          if (base + currentAdd >= 6) return;
          ws.bonusDrives[driveKey] = currentAdd + 1;
        } else {
          if (currentAdd <= 0) return;
          ws.bonusDrives[driveKey] = currentAdd - 1;
        }
        this.renderWizard();
      },

      finishWizard() {
        const ws = this.wizardState;
        const char = this.createCharacterFromSpecialty(ws.specialty);
        char.name = ws.name || (this.lang === "pt" ? "Investigador" : "Investigator");
        char.pronouns = ws.pronouns;
        char.circle = ws.circle;
        char.style = ws.style;
        char.catalyst = ws.catalyst;
        char.question = ws.question;

        char.actions[ws.zeroToOneAction] = (char.actions[ws.zeroToOneAction] || 0) + 1;
        Object.keys(ws.freePoints).forEach(k => {
          char.actions[k] = (char.actions[k] || 0) + (ws.freePoints[k] || 0);
        });

        ["nerve", "cunning", "intuition"].forEach(d => {
          const total = (SPECIALTIES_DATA[ws.specialty].startingDrives[d] || 0) + (ws.bonusDrives[d] || 0);
          char.drives[d].max = total;
          char.drives[d].current = total;
        });

        if (ws.extraGilded && !char.gilded.includes(ws.extraGilded)) {
          char.gilded.push(ws.extraGilded);
        }

        char.selectedAbilities = [ws.roleAbility, ws.specAbility].filter(Boolean);

        if (ws.relName) {
          char.relationships[0] = { name: ws.relName, archetype: ws.relArchetype, notes: "" };
        }

        this.characters.unshift(char);
        this.saveCharacters();
        this.activeCharId = char.id;
        this.navigate("sheet");
      },

        ];

        const zeroActions = allActs.filter(a => !(spec.startingActions[a.key] > 0));
        const freeUsed = Object.values(ws.freePoints).reduce((a, b) => a + b, 0);

        const el = document.getElementById("view-wizard");
        el.innerHTML = `

            </div>

              <h3 class="font-display text-base font-bold text-amber-300 uppercase tracking-wider">${t.wizStep1}</h3>
              <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 font-ui text-xs">
                ${Object.keys(SPECIALTIES_DATA).filter(k => k !== "blank").map(k => {
                  const s = SPECIALTIES_DATA[k];

                  return `
                    <button onclick="app.setWizardSpecialty('${k}')"
                      class="p-3 rounded border text-left transition ${active ? 'bg-amber-700 text-stone-950 border-amber-400 font-bold' : 'bg-stone-900 text-stone-200 border-stone-800 hover:border-amber-700/50'}">
                      <div class="text-[10px] uppercase opacity-75">${r.name[this.lang]}</div>
                      <div class="text-sm mt-0.5">${s.name[this.lang]}</div>
                    </button>
                  `;
                }).join("")}
              </div>
            </div>

            <!-- STEP 2: ACTIONS -->
            <div class="space-y-3 border-t border-stone-800 pt-6">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h3 class="font-display text-base font-bold text-amber-300 uppercase tracking-wider">${t.wizStep2}</h3>
                <span class="font-ui text-xs px-2.5 py-1 rounded border ${freeUsed === 3 ? 'bg-emerald-950/60 text-emerald-300 border-emerald-700' : 'bg-amber-950/60 text-amber-300 border-amber-700'}">
                  ${freeUsed} / 3
                </span>
              </div>

              <div class="bg-stone-900 p-3 rounded border border-stone-800 font-ui text-xs flex flex-wrap items-center gap-3">
                <span class="text-stone-300">${this.lang === 'pt' ? 'Ação de valor 0 elevada para 1:' : 'Rating-0 action raised to 1:'}</span>
                <select onchange="app.wizardState.zeroToOneAction = this.value; app.wizardState.freePoints[this.value] = Math.min(app.wizardState.freePoints[this.value]||0, 1); app.renderWizard();"
                  class="bg-stone-950 border border-amber-700/60 rounded px-2.5 py-1 text-amber-300 font-semibold">
                  ${zeroActions.map(a => {
                    const label = t.drives[a.drive].actions[a.key].name;
                    return `<option value="${a.key}" ${ws.zeroToOneAction === a.key ? 'selected' : ''}>${label} (0 → 1)</option>`;
                  }).join("")}
                </select>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 font-ui text-xs">
                ${allActs.map(a => {
                  const actObj = t.drives[a.drive].actions[a.key];
                  const specBase = spec.startingActions[a.key] || 0;
                  const base = specBase + (ws.zeroToOneAction === a.key ? 1 : 0);
                  const free = ws.freePoints[a.key] || 0;
                  const total = base + free;
                  return `
                    <div class="p-2.5 rounded bg-stone-900 border border-stone-800 flex items-center justify-between">
                      <div>
                        <span class="font-bold text-stone-100">${actObj.name}</span>
                        <span class="block text-[10px] text-stone-400">${actObj.desc}</span>
                        ${specBase > 0 ? `<span class="text-[9px] text-amber-400/90 uppercase">${this.lang === 'pt' ? `Padrão: ${specBase}` : `Preset: ${specBase}`}</span>` : ""}
                      </div>
                      <div class="flex items-center gap-1.5">
                        <button onclick="app.adjustWizFreeAction('${a.key}', -1)" class="w-6 h-6 rounded bg-stone-800 hover:bg-stone-700 text-white font-bold">-</button>
                        <span class="w-5 text-center font-bold text-sm ${total === 2 ? 'text-amber-400' : 'text-stone-200'}">${total}</span>
                        <button onclick="app.adjustWizFreeAction('${a.key}', 1)" class="w-6 h-6 rounded bg-stone-800 hover:bg-stone-700 text-white font-bold">+</button>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>

            <!-- STEP 3: DRIVES & RESISTANCES -->
            <div class="space-y-3 border-t border-stone-800 pt-6">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h3 class="font-display text-base font-bold text-amber-300 uppercase tracking-wider">${t.wizStep3}</h3>
                <span class="font-ui text-xs px-2.5 py-1 rounded border ${driveUsed === 6 ? 'bg-emerald-950/60 text-emerald-300 border-emerald-700' : 'bg-amber-950/60 text-amber-300 border-amber-700'}">
                  ${driveUsed} / 6
                </span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 font-ui text-xs">
                ${["nerve", "cunning", "intuition"].map(d => {
                  const base = spec.startingDrives[d] || 0;
                  const add = ws.bonusDrives[d] || 0;
                  const total = base + add;
                  const res = Math.floor(total / 3);
                  return `
                    <div class="p-4 rounded bg-stone-900 border border-stone-800 space-y-2">
                      <div class="flex items-center justify-between">
                        <span class="font-display font-bold text-amber-400 text-sm">${t.drives[d].name}</span>
                        <span class="text-[11px] text-stone-400">${t.lblResistance}: <strong class="text-amber-300">${res}</strong></span>
                      </div>
                      <div class="flex items-center justify-between pt-1">
                        <span class="text-stone-400">Base: ${base}</span>
                        <div class="flex items-center gap-2">
                          <button onclick="app.adjustWizDrive('${d}', -1)" class="w-7 h-7 rounded bg-stone-800 hover:bg-stone-700 font-bold">-</button>
                          <span class="text-base font-bold text-white w-6 text-center">${total}</span>
                          <button onclick="app.adjustWizDrive('${d}', 1)" class="w-7 h-7 rounded bg-stone-800 hover:bg-stone-700 font-bold">+</button>
                        </div>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>

            <!-- STEP 4: GILD AN ACTION -->
            <div class="space-y-3 border-t border-stone-800 pt-6 font-ui text-xs">
              <h3 class="font-display text-base font-bold text-amber-300 uppercase tracking-wider">${t.wizStep4}</h3>
              <div class="flex flex-wrap items-center gap-4">
                <div class="px-3 py-2 rounded bg-stone-900 border border-stone-800">
                  <span class="text-stone-400">${this.lang === 'pt' ? 'Ação Dourada Inicial:' : 'Starting Gilded Action:'}</span>
                  <strong class="text-amber-400 ml-1">${ allActs.find(a => a.key === spec.startingGilded[0]) ? t.drives[allActs.find(a => a.key === spec.startingGilded[0]).drive].actions[spec.startingGilded[0]].name : '' }</strong>
                </div>
                <div class="flex items-center gap-2">
                  <span>${this.lang === 'pt' ? 'Segunda Ação Dourada:' : 'Second Gilded Action:'}</span>
                  <select onchange="app.wizardState.extraGilded = this.value; app.renderWizard();"
                    class="bg-stone-900 border border-amber-700/60 rounded px-3 py-1.5 text-amber-300 font-semibold">
                    ${allActs.filter(a => !spec.startingGilded.includes(a.key)).map(a => {
                      const name = t.drives[a.drive].actions[a.key].name;
                      return `<option value="${a.key}" ${ws.extraGilded === a.key ? 'selected' : ''}>${name}</option>`;
                    }).join("")}
                  </select>
                </div>
              </div>
            </div>

            <!-- STEP 5: ABILITIES -->
            <div class="space-y-4 border-t border-stone-800 pt-6">
              <h3 class="font-display text-base font-bold text-amber-300 uppercase tracking-wider">${t.wizStep5}</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                  <label class="font-ui text-xs uppercase tracking-wider text-stone-400">${t.lblRole} ${role.name[this.lang]}</label>
                  ${role.abilities.map(ab => `
                    <div onclick="app.wizardState.roleAbility = '${ab.id}'; app.renderWizard();"
                      class="p-3 rounded border cursor-pointer transition ${ws.roleAbility === ab.id ? 'bg-amber-950/50 border-amber-500 text-stone-100' : 'bg-stone-900 border-stone-800 text-stone-300'}">
                      <div class="font-bold text-amber-300">${ab.name[this.lang]}</div>
                      <p class="text-xs mt-1 leading-relaxed">${ab.text[this.lang]}</p>
                    </div>
                  `).join("")}
                </div>
                <div class="space-y-2">
                  <label class="font-ui text-xs uppercase tracking-wider text-stone-400">${t.lblSpecialty} ${spec.name[this.lang]}</label>
                  <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
                    ${spec.abilities.map(ab => `
                      <div onclick="app.wizardState.specAbility = '${ab.id}'; app.renderWizard();"
                        class="p-3 rounded border cursor-pointer transition ${ws.specAbility === ab.id ? 'bg-amber-950/50 border-amber-500 text-stone-100' : 'bg-stone-900 border-stone-800 text-stone-300'}">
                        <div class="font-bold text-amber-300">${ab.name[this.lang]}</div>
                        <p class="text-xs mt-1 leading-relaxed">${ab.text[this.lang]}</p>
                      </div>
                    `).join("")}
                  </div>
                </div>
              </div>
            </div>

            <!-- STEP 6: DETAILS -->
            <div class="space-y-4 border-t border-stone-800 pt-6 font-ui text-xs">
              <h3 class="font-display text-base font-bold text-amber-300 uppercase tracking-wider">${t.wizStep6}</h3>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label class="block text-stone-400 mb-1">${t.lblName}</label>
                  <input type="text" value="${ws.name}" oninput="app.wizardState.name = this.value" class="w-full px-3 py-2 rounded bg-stone-900 border border-stone-700 text-white" />
                </div>
                <div>
                  <label class="block text-stone-400 mb-1">${t.lblPronouns}</label>
                  <input type="text" value="${ws.pronouns}" oninput="app.wizardState.pronouns = this.value" class="w-full px-3 py-2 rounded bg-stone-900 border border-stone-700 text-white" />
                </div>
                <div>
                  <label class="block text-stone-400 mb-1">${t.lblCircle}</label>
                  <input type="text" value="${ws.circle}" oninput="app.wizardState.circle = this.value" class="w-full px-3 py-2 rounded bg-stone-900 border border-stone-700 text-white" />
                </div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label class="block text-stone-400 mb-1">${t.lblStyle}</label>
                  <input type="text" value="${ws.style}" oninput="app.wizardState.style = this.value" class="w-full px-3 py-2 rounded bg-stone-900 border border-stone-700 text-white" />
                </div>
                <div>
                  <label class="block text-stone-400 mb-1">${t.lblCatalyst}</label>
                  <input type="text" value="${ws.catalyst}" oninput="app.wizardState.catalyst = this.value" class="w-full px-3 py-2 rounded bg-stone-900 border border-stone-700 text-white" />
                </div>
                <div>
                  <label class="block text-stone-400 mb-1">${t.lblQuestion}</label>
                  <input type="text" value="${ws.question}" oninput="app.wizardState.question = this.value" class="w-full px-3 py-2 rounded bg-stone-900 border border-stone-700 text-white" />
                </div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <div>
                  <label class="block text-stone-400 mb-1">${t.lblRelationships} — ${t.lblRelNamePlaceholder}</label>
                  <input type="text" value="${ws.relName}" oninput="app.wizardState.relName = this.value" class="w-full px-3 py-2 rounded bg-stone-900 border border-stone-700 text-white" />
                </div>
                <div>
                  <label class="block text-stone-400 mb-1">${t.lblRelTypePlaceholder}</label>
                  <select onchange="app.wizardState.relArchetype = this.value" class="w-full px-3 py-2 rounded bg-stone-900 border border-stone-700 text-white">
                    ${t.relationshipArchetypes.map(arc => `<option value="${arc}" ${ws.relArchetype === arc ? 'selected' : ''}>${arc}</option>`).join("")}
                  </select>
                </div>
              </div>
            </div>

            <div class="pt-4 border-t border-stone-800 flex justify-end">
              <button onclick="app.finishWizard()" class="px-6 py-3 rounded bg-amber-700 hover:bg-amber-600 text-stone-950 font-ui font-bold text-xs uppercase tracking-wider shadow-xl transition">
                ${t.wizFinish}
              </button>
            </div>
          </div>
        `;
      },

      /* ========================================================================
         VIEW 3: OFFICIAL 3-COLUMN INTERACTIVE CHARACTER SHEET
         ======================================================================== */
      renderSheet() {
        const c = this.getActiveChar();
        if (!c) return;
        const t = I18N[this.lang];
        const spec = SPECIALTIES_DATA[c.specialty] || SPECIALTIES_DATA.journalist;
        const role = ROLES_DATA[c.role] || ROLES_DATA.face;

        const renderAbilityItem = (ab) => {
          const checked = c.selectedAbilities.includes(ab.id);
          let choicesHtml = "";
          if (ab.choices && ab.choices[this.lang]) {
            const selectedIdx = c.abilitySubChoices?.[ab.id];
            choicesHtml = " " + ab.choices[this.lang].map((choiceText, idx) => {
              const isCircled = selectedIdx === idx;
              return `<span onclick="event.stopPropagation(); app.selectAbilitySubChoice('${ab.id}', ${idx})" class="sub-option-pill ${isCircled ? 'circled' : ''}">${choiceText}</span>`;
            }).join(", ") + ".";
          }

          return `
            <div onclick="app.toggleAbility('${ab.id}')" class="flex items-start gap-2.5 cursor-pointer group">
              <span class="diamond-check mt-1.5 ${checked ? 'checked' : ''}"></span>
              <p class="text-[14.5px] leading-snug">
                <strong class="font-bold group-hover:text-amber-900">${ab.name[this.lang]}:</strong>
                ${ab.text[this.lang]}${choicesHtml}
              </p>
            </div>
          `;
        };

        const renderDriveBlock = (driveKey) => {
          const dInfo = t.drives[driveKey];
          const dState = c.drives[driveKey];
          const specBaseDrive = spec.startingDrives?.[driveKey] || 0;
          const resMax = Math.floor((dState.max || 0) / 3);

          let driveCellsHtml = "";
          for (let group = 0; group < 3; group++) {
            driveCellsHtml += `<div class="inline-flex gap-[2px] mr-2 last:mr-0">`;
            for (let i = group * 3 + 1; i <= group * 3 + 3; i++) {
              const isCur = i <= dState.current;
              const isMax = i <= dState.max;
              const isPresetDrive = i <= specBaseDrive;
              driveCellsHtml += `
                <div class="flex flex-col items-center">
                  <div onclick="app.setDriveCurrent('${driveKey}', ${i})" title="${t.lblDrives} (${i})"
                    class="drive-cell ${isCur ? 'active' : ''}"></div>
                  <div onclick="app.setDriveMax('${driveKey}', ${i})" title="${t.lblMax} (${i})"
                    class="drive-max-cell ${isMax ? 'active' : ''} ${isPresetDrive && isMax ? 'preset-base' : ''}"></div>
                </div>
              `;
            }
            driveCellsHtml += `</div>`;
          }

          let resTrianglesHtml = `<div class="inline-flex items-center">`;
          for (let r = 0; r < 3; r++) {
            const avail = r < resMax;
            const burned = dState.burned?.[r] || false;
            const fill = burned ? "#741b1b" : (avail ? "#cfa042" : "#f3ede0");
            const stroke = burned ? "#420c0c" : "#161412";
            resTrianglesHtml += `
              <div onclick="app.toggleResistanceBurn('${driveKey}', ${r})" class="cursor-pointer flex items-center" title="${t.lblResistance}">
                <svg class="w-4 h-4" viewBox="0 0 18 16">
                  <polygon points="2,2 16,2 9,14" fill="${fill}" stroke="${stroke}" stroke-width="1.8"/>
                </svg>
                ${r < 2 ? `<div class="w-3 h-[1.5px] bg-[#161412]"></div>` : ""}
              </div>
            `;
          }
          resTrianglesHtml += `</div>`;

          const actionsHtml = Object.keys(dInfo.actions).map(actKey => {
            const act = dInfo.actions[actKey];
            const rating = c.actions[actKey] || 0;
            const specActionBase = spec.startingActions?.[actKey] || 0;
            const isGilded = c.gilded.includes(actKey);
            return `
              <div class="py-2 border-b border-stone-400/60 last:border-none">
                <div class="flex items-baseline justify-between gap-2">
                  <div class="flex items-center gap-2 shrink-0">
                    <span onclick="app.toggleGilded('${actKey}')" class="diamond-check ${isGilded ? 'gilded' : ''}" title="Gilded / Dourado"></span>
                    <button onclick="app.openRollModal('${actKey}')"
                      class="font-display font-bold text-[15px] hover:text-amber-800 transition text-left">
                      ${act.name}
                    </button>
                  </div>
                  <span class="text-[13px] italic text-stone-800 text-right leading-tight">${act.desc}</span>
                </div>
                <div class="flex items-center justify-between mt-1.5 pl-5">
                  <div class="flex items-center gap-2">
                    ${[1, 2, 3].map(n => {
                      const isPresetDot = n <= specActionBase;
                      return `
                        <span onclick="app.setActionRating('${actKey}', ${n})"
                          title="${isPresetDot ? (this.lang === 'pt' ? 'Ponto inicial da especialidade' : 'Specialty starting point') : ''}"
                          class="action-dot ${rating >= n ? 'filled' : ''} ${isPresetDot ? 'preset-base' : ''}"></span>
                      `;
                    }).join("")}
                  </div>
                  <button onclick="app.openRollModal('${actKey}')"
                    class="no-print text-[10px] font-ui uppercase tracking-wider px-2 py-0.5 rounded border border-stone-500/60 hover:bg-[#161412] hover:text-[#f3ede0] transition">
                    ${this.lang === 'pt' ? 'Rolar' : 'Roll'} (${rating}d6)
                  </button>
                </div>
              </div>
            `;
          }).join("");

          return `
            <div class="border-2 border-[#161412] bg-[#f8f4ea]">
              <div class="sheet-header-bar px-3 py-1.5 flex items-center justify-between gap-2">
                <span class="font-bold text-base tracking-widest">${dInfo.name}</span>
                <div class="flex items-center gap-1.5">
                  <div class="text-right font-ui text-[9px] leading-tight uppercase opacity-85">
                    <div>${t.lblDrives}</div>
                    <div class="text-amber-300">${t.lblMax}</div>
                  </div>
                  <div class="flex items-center bg-[#f3ede0] text-[#161412] px-1.5 py-1 rounded-[1px]">
                    ${driveCellsHtml}
                  </div>
                </div>
              </div>

              <div class="px-3 py-1 bg-[#e8dfc9] border-b border-[#161412] flex items-center justify-between">
                <span class="font-display text-[10px] font-bold tracking-widest">${t.lblResistance}</span>
                ${resTrianglesHtml}
              </div>

              <div class="p-3">
                ${actionsHtml}
              </div>
            </div>
          `;
        };

        const keysList = c.specialty === "blank"
          ? (c.customKeys || ["", "", ""])
          : (spec.keys[this.lang] || ["", "", ""]);

        const stdGear = t.standardGear;
        const specGear = spec.gear[this.lang] || ["", "", ""];
        const allFixedGear = [...stdGear, ...specGear];

        const container = document.getElementById("view-sheet");
        container.innerHTML = `
          <!-- Top Utility Bar -->
          <div class="no-print mb-4 flex flex-wrap items-center justify-between gap-2 bg-[#171412] border border-stone-800 rounded px-3 py-2 font-ui text-xs text-stone-200">
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-stone-400">${this.lang === 'pt' ? 'Investigador:' : 'Investigator:'}</span>
              <select onchange="app.openCharacter(this.value)" class="bg-stone-900 border border-amber-700/60 rounded px-2 py-1 text-amber-300 font-semibold">
                ${this.characters.map(ch => `
                  <option value="${ch.id}" ${ch.id === c.id ? 'selected' : ''}>
                    ${ch.name || (this.lang === 'pt' ? 'Sem Nome' : 'Unnamed')} (${(SPECIALTIES_DATA[ch.specialty]?.name[this.lang]) || ''})
                  </option>
                `).join("")}
              </select>

              <span class="text-stone-400">${t.lblSpecialty}</span>
              <select onchange="app.changeSheetSpecialty(this.value)" class="bg-stone-900 border border-amber-600/60 rounded px-2 py-1 text-amber-200 font-semibold">
                ${Object.keys(SPECIALTIES_DATA).map(k => `
                  <option value="${k}" ${c.specialty === k ? 'selected' : ''}>
                    ${ROLES_DATA[SPECIALTIES_DATA[k].role].name[this.lang]} — ${SPECIALTIES_DATA[k].name[this.lang]}
                  </option>
                `).join("")}
              </select>

              <button onclick="app.changeSheetSpecialty('${c.specialty}')" class="px-2 py-1 rounded bg-stone-900 hover:bg-stone-800 text-stone-300 border border-stone-700 transition">
                ${t.lblResetPreset}
              </button>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="window.print()" class="px-2.5 py-1 rounded bg-stone-900 hover:bg-stone-800 border border-stone-700">Print / PDF</button>
              <button onclick="app.exportSingleChar('${c.id}')" class="px-2.5 py-1 rounded bg-amber-700 hover:bg-amber-600 text-stone-950 font-semibold">Export JSON</button>
            </div>
          </div>

          <!-- OFFICIAL SHEET PARCHMENT -->
          <div class="sheet-paper p-5 sm:p-8">

            <!-- HEADER -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 pb-5 border-b-2 border-[#161412] items-end">
              <div class="lg:col-span-4 grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-2">
                <div class="flex items-baseline gap-1.5">
                  <label class="font-bold text-sm shrink-0">${t.lblName}</label>
                  <input class="sheet-input" value="${c.name}" oninput="app.updateCharField('name', this.value)" />
                </div>
                <div class="flex items-baseline gap-1.5">
                  <label class="font-bold text-sm shrink-0">${t.lblPronouns}</label>
                  <input class="sheet-input" value="${c.pronouns}" oninput="app.updateCharField('pronouns', this.value)" />
                </div>
                <div class="flex items-baseline gap-1.5">
                  <label class="font-bold text-sm shrink-0">${t.lblCircle}</label>
                  <input class="sheet-input" value="${c.circle}" oninput="app.updateCharField('circle', this.value)" />
                </div>
                <div class="flex items-baseline gap-1.5">
                  <label class="font-bold text-sm shrink-0">${t.lblStyle}</label>
                  <input class="sheet-input" value="${c.style}" oninput="app.updateCharField('style', this.value)" />
                </div>
              </div>

              <!-- CENTER CANDELA OBSCURA EMBLEM -->
              <div class="lg:col-span-4 text-center py-1">
                <div class="inline-flex flex-col items-center">
                  <div class="font-display text-2xl sm:text-3xl font-extrabold tracking-[0.24em] leading-none">CANDELA</div>
                  <div class="w-full flex items-center gap-2 my-1">
                    <div class="flex-1 h-[1.5px] bg-[#161412]"></div>
                    <span class="diamond-check" style="width:7px;height:7px;cursor:default;"></span>
                    <div class="flex-1 h-[1.5px] bg-[#161412]"></div>
                  </div>
                  <div class="font-display text-xl sm:text-2xl font-bold tracking-[0.3em] leading-none">OBSCURA</div>
                </div>
              </div>

              <div class="lg:col-span-4 space-y-2">
                <div class="flex items-baseline gap-1.5">
                  <label class="font-bold text-sm shrink-0">${t.lblCatalyst}</label>
                  <input class="sheet-input" value="${c.catalyst}" oninput="app.updateCharField('catalyst', this.value)" />
                </div>
                <div class="flex items-baseline gap-1.5">
                  <label class="font-bold text-sm shrink-0">${t.lblQuestion}</label>
                  <input class="sheet-input" value="${c.question}" oninput="app.updateCharField('question', this.value)" />
                </div>
              </div>
            </div>

            <!-- 3-COLUMN BODY -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 pt-5">

              <!-- LEFT COLUMN: DRIVES, ACTIONS, ILLUMINATION KEYS -->
              <div class="lg:col-span-4 space-y-4">
                ${renderDriveBlock("nerve")}
                ${renderDriveBlock("cunning")}
                ${renderDriveBlock("intuition")}

                <div class="text-center text-[12.5px] italic border border-[#161412] py-1.5 px-2 bg-[#e8dfc9]">
                  ${t.lblBurnRule}
                </div>

                <!-- ILLUMINATION KEYS -->
                <div class="border-2 border-[#161412] p-3 bg-[#f8f4ea]">
                  <h4 class="font-display text-xs font-bold uppercase tracking-widest text-center border-b border-[#161412] pb-1 mb-2">
                    ${t.lblIlluminationKeys}
                  </h4>
                  <div class="flex flex-wrap items-center justify-around gap-2 text-sm font-semibold text-center">
                    ${keysList.map((k, idx) => c.specialty === "blank"

                      ? `<textarea rows="5" oninput="app.updateCharField('customRoleAbilities', this.value)" class="w-full bg-transparent border border-stone-400 p-2 text-sm" placeholder="...">${c.customRoleAbilities || ""}</textarea>`

                  </div>
                  <div class="p-3.5 space-y-3">
                    ${spec.abilities.length === 0
                      ? `<textarea rows="12" oninput="app.updateCharField('customSpecAbilities', this.value)" class="w-full bg-transparent border border-stone-400 p-2 text-sm" placeholder="...">${c.customSpecAbilities || ""}</textarea>`
                      : spec.abilities.map(ab => renderAbilityItem(ab)).join("")}

              <!-- RIGHT COLUMN: MARKS, SCARS, RELATIONSHIPS, GEAR, NOTES -->

                    ${[
                      { key: "body", label: t.lblBody },
                      { key: "brain", label: t.lblBrain },
                      { key: "bleed", label: t.lblBleed }
                    ].map(m => {
                      const val = c.marks[m.key] || 0;
                      return `
                        <div class="px-2 space-y-2">
                          <div class="font-display text-xs font-bold tracking-wider">${m.label}</div>
                          <div class="flex items-center justify-center gap-2">
                            ${[1, 2, 3].map(n => `
                              <span onclick="app.setMark('${m.key}', ${n})" class="mark-dot ${val >= n ? 'filled' : ''}"></span>
                            `).join("")}
                          </div>
                        </div>
                      `;
                    }).join("")}
                  </div>

                <div class="border-2 border-[#161412] bg-[#f8f4ea]">
                  <div class="sheet-header-bar px-3 py-1.5 text-sm font-bold">${t.lblScars}</div>

                    ${c.scars.map((sc, idx) => `
                      <div class="flex items-center gap-2">
                        <select onchange="app.updateScarType(${idx}, this.value)"
                          class="bg-[#e8dfc9] border border-[#161412] text-xs font-bold px-1.5 py-1">
                          <option value="body" ${sc.type === 'body' ? 'selected' : ''}>${t.lblBody}</option>
                          <option value="brain" ${sc.type === 'brain' ? 'selected' : ''}>${t.lblBrain}</option>
                          <option value="bleed" ${sc.type === 'bleed' ? 'selected' : ''}>${t.lblBleed}</option>
                        </select>
                        <input class="sheet-input text-sm" placeholder="${t.lblScarPlaceholder}"
                          value="${sc.text}" oninput="app.updateScarText(${idx}, this.value)" />
                      </div>
                    `).join("")}
                    <p class="text-xs italic text-stone-800 pt-1 leading-tight">${t.lblScarRule}</p>
                  </div>
                </div>

                <!-- RELATIONSHIPS -->
                <div class="border-2 border-[#161412] bg-[#f8f4ea]">
                  <div class="sheet-header-bar px-3 py-1.5 flex items-center justify-between">
                    <span class="text-sm font-bold">${t.lblRelationships}</span>

                  </div>
                  <div class="p-3 space-y-2">
                    ${c.relationships.map((rel, idx) => `
                      <div class="grid grid-cols-12 gap-1.5 items-center">

                          value="${rel.name}" oninput="app.updateRel(${idx}, 'name', this.value)" />
                        <input class="col-span-6 sheet-input text-sm" list="rel-archetypes-list" placeholder="${t.lblRelTypePlaceholder}"

      /* Sheet Interaction Methods */
      updateCharField(field, val) {
        const c = this.getActiveChar();
        if (!c) return;
        c[field] = val;
        this.saveCharacters();
      },

      changeSheetSpecialty(newSpecKey) {
        const c = this.getActiveChar();
        if (!c) return;
        this.applySpecialtyDefaultsToCharacter(c, newSpecKey);
        this.saveCharacters();
        this.renderSheet();
      },

      setDriveCurrent(driveKey, val) {
        const c = this.getActiveChar();
        const d = c.drives[driveKey];
        d.current = d.current === val ? val - 1 : val;
        this.saveCharacters();
        this.renderSheet();
      },

      setDriveMax(driveKey, val) {
        const c = this.getActiveChar();
        const d = c.drives[driveKey];
        d.max = d.max === val ? val - 1 : val;
        if (d.current > d.max) d.current = d.max;
        this.saveCharacters();
        this.renderSheet();
      },

      toggleResistanceBurn(driveKey, idx) {
        const c = this.getActiveChar();
        const d = c.drives[driveKey];
        if (!d.burned) d.burned = [false, false, false];
        d.burned[idx] = !d.burned[idx];
        this.saveCharacters();
        this.renderSheet();
      },

      setActionRating(actKey, val) {
        const c = this.getActiveChar();
        c.actions[actKey] = c.actions[actKey] === val ? val - 1 : val;
        this.saveCharacters();
        this.renderSheet();
      },

      toggleGilded(actKey) {
        const c = this.getActiveChar();
        if (c.gilded.includes(actKey)) {
          c.gilded = c.gilded.filter(k => k !== actKey);
        } else {
          c.gilded.push(actKey);
        }
        this.saveCharacters();
        this.renderSheet();
      },

      toggleAbility(abId) {
        const c = this.getActiveChar();
        if (c.selectedAbilities.includes(abId)) {
          c.selectedAbilities = c.selectedAbilities.filter(id => id !== abId);
        } else {
          c.selectedAbilities.push(abId);
        }
        this.saveCharacters();
        this.renderSheet();
      },

      selectAbilitySubChoice(abId, idx) {
        const c = this.getActiveChar();
        if (!c.abilitySubChoices) c.abilitySubChoices = {};
        c.abilitySubChoices[abId] = c.abilitySubChoices[abId] === idx ? null : idx;
        this.saveCharacters();
        this.renderSheet();
      },

      setMark(markKey, val) {
        const c = this.getActiveChar();
        c.marks[markKey] = c.marks[markKey] === val ? val - 1 : val;
        this.saveCharacters();
        this.renderSheet();
      },

      updateScarType(idx, val) {
        const c = this.getActiveChar();
        c.scars[idx].type = val;
        this.saveCharacters();
      },

      updateScarText(idx, val) {
        const c = this.getActiveChar();
        c.scars[idx].text = val;
        this.saveCharacters();
      },

      addRelationship() {
        const c = this.getActiveChar();
        c.relationships.push({ name: "", archetype: "", notes: "" });
        this.saveCharacters();
        this.renderSheet();
      },

      removeRelationship(idx) {
        const c = this.getActiveChar();
        c.relationships.splice(idx, 1);
        this.saveCharacters();
        this.renderSheet();
      },

      updateRel(idx, field, val) {
        const c = this.getActiveChar();
        c.relationships[idx][field] = val;
        this.saveCharacters();
      },

      toggleGear(idx) {
        const c = this.getActiveChar();
        if (!c.gearChecked) c.gearChecked = [];
        c.gearChecked[idx] = !c.gearChecked[idx];
        this.saveCharacters();
        this.renderSheet();
      },

      updateCustomGear(idx, val) {
        const c = this.getActiveChar();
        if (!c.customGear) c.customGear = ["", ""];
        c.customGear[idx] = val;
        this.saveCharacters();
      },

      updateCustomKey(idx, val) {
        const c = this.getActiveChar();
        if (!c.customKeys) c.customKeys = ["", "", ""];
        c.customKeys[idx] = val;
        this.saveCharacters();
      },

      /* ========================================================================
         VIEW 4: INTERACTIVE CIRCLE SHEET
         ======================================================================== */
      renderCircle() {
        const t = I18N[this.lang];
        const cir = this.circle;

        const radius = 106;
        const center = 136;
        let nodesHtml = "";
        for (let i = 1; i <= 24; i++) {
          const angle = ((i - 1) / 24) * 2 * Math.PI - Math.PI / 2;
          const x = center + radius * Math.cos(angle);
          const y = center + radius * Math.sin(angle);
          const isMilestone = i % 6 === 0;
          const filled = i <= cir.illumination;
          nodesHtml += `
            <div onclick="app.setCircleIllumination(${i})"
              style="left: ${x - 12}px; top: ${y - 12}px;"
              title="Illumination ${i}"
              class="absolute w-6 h-6 rounded-full cursor-pointer transition flex items-center justify-center text-[10px] font-ui font-bold
                ${isMilestone ? 'border-[3.5px] border-[#161412] ring-2 ring-amber-700/70' : 'border-2 border-[#161412]'}
                ${filled ? 'bg-[#161412] text-[#f3ede0]' : 'bg-[#f8f4ea] text-[#161412] hover:bg-amber-200/70'}">
            </div>
          `;
        }

        const renderResourceBar = (resKey, label) => {
          const rState = cir.resources[resKey];
          let cells = "";
          for (let group = 0; group < 3; group++) {
            cells += `<div class="inline-flex gap-[2px] mr-2 last:mr-0">`;
            for (let i = group * 3 + 1; i <= group * 3 + 3; i++) {
              const avail = i <= rState.available;
              const max = i <= rState.max;
              cells += `
                <div class="flex flex-col items-center">
                  <div onclick="app.setCircleRes('${resKey}', 'available', ${i})" class="drive-cell ${avail ? 'active' : ''}"></div>
                  <div onclick="app.setCircleRes('${resKey}', 'max', ${i})" class="drive-max-cell ${max ? 'active' : ''}"></div>
                </div>
              `;
            }
            cells += `</div>`;
          }
          return `
            <div class="sheet-header-bar px-3 py-2 flex items-center justify-between">
              <span class="font-bold tracking-widest text-sm">${label}</span>
              <div class="flex items-center gap-2">
                <div class="bg-[#f3ede0] text-[#161412] px-2 py-1 rounded-[1px] flex items-center">
                  ${cells}
                </div>
                <div class="text-[10px] font-ui leading-tight text-right">
                  <div>${t.resAvailable}</div>
                  <div class="text-amber-300">${t.resMax}</div>
                </div>
              </div>
            </div>
          `;
        };

        const container = document.getElementById("view-circle");
        container.innerHTML = `
          <div class="sheet-paper p-5 sm:p-8 space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 pb-5 border-b-2 border-[#161412] items-end">
              <div class="lg:col-span-4 space-y-2">
                <div class="flex items-baseline gap-2">
                  <label class="font-display font-bold text-base shrink-0">${t.circleHeaderTitle}</label>
                  <input class="sheet-input text-lg font-bold" value="${cir.name}" oninput="app.circle.name = this.value; app.saveCircle();" />
                </div>
                <div class="flex items-baseline gap-2">
                  <label class="font-bold text-sm shrink-0">${t.circleChapterLoc}</label>
                  <input class="sheet-input" value="${cir.location}" oninput="app.circle.location = this.value; app.saveCircle();" />
                </div>
              </div>

              <div class="lg:col-span-4 text-center">
                <div class="font-display text-2xl sm:text-3xl font-extrabold tracking-[0.24em]">CANDELA OBSCURA</div>
              </div>

              <div class="lg:col-span-4 space-y-2">
                <div class="flex items-baseline gap-2">
                  <label class="font-bold text-sm shrink-0">${t.circleMembers}</label>
                  <input class="sheet-input" value="${cir.members}" oninput="app.circle.members = this.value; app.saveCircle();" />
                </div>
                <div class="flex items-baseline gap-2">
                  <label class="font-bold text-sm shrink-0">${t.circleTone}</label>
                  <input class="sheet-input" value="${cir.tone}" oninput="app.circle.tone = this.value; app.saveCircle();" />
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div class="lg:col-span-7 space-y-5">
                <div class="border-2 border-[#161412] bg-[#f8f4ea]">
                  <div class="sheet-header-bar px-3 py-1.5 text-sm font-bold">${t.circleIllumHeader}</div>
                  <div class="p-4 space-y-3">
                    <p class="text-xs italic text-stone-800">${t.circleIllumSub}</p>
                    ${t.circleQuestions.map((q, idx) => `
                      <div onclick="app.circle.questions[${idx}] = !app.circle.questions[${idx}]; app.saveCircle(); app.renderCircle();"
                        class="flex items-center gap-2.5 cursor-pointer">
                        <span class="gear-box ${cir.questions[idx] ? 'checked' : ''}"></span>
                        <span class="text-sm font-semibold">${q}</span>
                      </div>
                    `).join("")}
                    <p class="text-xs text-stone-800 pt-2 border-t border-stone-300 leading-relaxed">${t.circleKeyNote}</p>
                  </div>
                </div>

                <div class="border-2 border-[#161412] bg-[#f8f4ea]">
                  <div class="sheet-header-bar px-3 py-1.5 text-sm font-bold">${t.circleAbilitiesHeader}</div>
                  <div class="p-4 space-y-3">
                    <p class="text-xs italic text-stone-800">${t.circleAbilitiesSub}</p>
                    ${t.circleAbilitiesList.map(ab => {
                      const checked = cir.abilities.includes(ab.id);
                      return `
                        <div onclick="app.toggleCircleAbility('${ab.id}')" class="flex items-start gap-2.5 cursor-pointer">
                          <span class="diamond-check mt-1.5 ${checked ? 'checked' : ''}"></span>
                          <p class="text-sm leading-snug"><strong>${ab.name}:</strong> ${ab.text}</p>
                        </div>
                      `;
                    }).join("")}
                  </div>
                </div>

                <div class="border-2 border-[#161412] bg-[#f8f4ea] p-4 space-y-3">
                  <h4 class="font-display font-bold text-sm tracking-wider">${t.resHeader}</h4>
                  <p class="text-xs italic text-stone-800">${t.resSub}</p>
                  <div class="space-y-2">
                    ${renderResourceBar("stitch", t.resStitch)}
                    ${renderResourceBar("refresh", t.resRefresh)}
                    ${renderResourceBar("train", t.resTrain)}
                  </div>
                </div>
              </div>

              <div class="lg:col-span-5 space-y-5">
                <div class="border-2 border-[#161412] bg-[#f8f4ea] p-4 flex flex-col items-center">
                  <h4 class="font-display font-bold text-base tracking-widest mb-2">ILLUMINATION</h4>
                  <div class="relative w-[272px] h-[272px] my-2">
                    ${nodesHtml}
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                      <svg class="w-20 h-32 text-[#161412]" viewBox="0 0 64 100" fill="currentColor">
                        <path d="M31 4C27 12 29 17 33 22C36 26 35 31 32 35C38 31 40 24 35 17C32 13 31 9 31 4Z"/>
                        <path d="M24 38L39 42V92H24V38Z"/>
                      </svg>
                    </div>
                  </div>
                </div>

                <div class="border-2 border-[#161412] bg-[#f8f4ea] p-4 space-y-3 text-sm">
                  <h4 class="font-display font-bold text-xs tracking-widest border-b border-[#161412] pb-1">${t.circleAdvHeader}</h4>
                  <p class="text-xs leading-relaxed">${t.circleAdvText}</p>
                  <h4 class="font-display font-bold text-xs tracking-widest border-b border-[#161412] pb-1 pt-2">${t.charAdvHeader}</h4>
                  <p class="text-xs italic">${t.charAdvSub}</p>
                  <ul class="space-y-1.5 pt-1">
                    ${t.charAdvOptions.map(o => `
                      <li class="flex items-center gap-2 text-xs font-semibold">
                        <span class="diamond-check" style="width:9px;height:9px;cursor:default;"></span>
                        <span>${o}</span>
                      </li>
                    `).join("")}
                  </ul>
                </div>

                <div class="border-2 border-[#161412] bg-[#f8f4ea]">
                  <div class="sheet-header-bar px-3 py-1.5 text-sm font-bold">${t.circleGearHeader}</div>
                  <div class="p-3 space-y-2">
                    ${cir.gear.map((g, idx) => `
                      <input class="sheet-input text-sm" placeholder="..."
                        value="${g}" oninput="app.circle.gear[${idx}] = this.value; app.saveCircle();" />
                    `).join("")}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      },

      setCircleIllumination(val) {
        this.circle.illumination = this.circle.illumination === val ? val - 1 : val;
        this.saveCircle();
        this.renderCircle();
      },

      toggleCircleAbility(abId) {
        if (this.circle.abilities.includes(abId)) {
          this.circle.abilities = this.circle.abilities.filter(x => x !== abId);
        } else {
          this.circle.abilities.push(abId);
        }
        this.saveCircle();
        this.renderCircle();
      },

      setCircleRes(resKey, field, val) {
        const r = this.circle.resources[resKey];
        r[field] = r[field] === val ? val - 1 : val;
        this.saveCircle();
        this.renderCircle();
      },

      /* ========================================================================
         5. DYNAMIC & AUTOMATED ILLUMINATED WORLDS DICE ROLLER ENGINE
         ======================================================================== */
      getAvailableResistanceCount(char, driveKey) {
        const d = char.drives[driveKey];
        if (!d) return 0;
        const maxRes = Math.floor((d.max || 0) / 3);
        let burnedCount = 0;
        for (let i = 0; i < maxRes; i++) {
          if (d.burned?.[i]) burnedCount++;
        }
        return Math.max(0, maxRes - burnedCount);
      },

      openRollModal(actKey = "survey") {
        const c = this.getActiveChar();
        if (!c) return;
        const defaultDrive = ACTION_TO_DRIVE[actKey] || "intuition";
        const isActionGilded = c.gilded.includes(actKey);

        this.rollContext = {
          actKey,
          driveToSpend: defaultDrive,
          stakes: "standard", // low | standard | high
          driveSpent: 0,
          allyAssist: false,
          bonusDice: 0,
          gildedOverride: isActionGilded,
          extraGildedDice: 0,
          firstDrivePlusTwo: false, // Lie Detector, Misdirection, Better Part of Valor, Back Against the Wall
          results: null,
          selectedResultIdx: null,
          gildedClaimed: false,
          wellReadClaimed: false,
          learnMistakesClaimed: false,
          flourishUsed: false,
          isReroll: false,
          statusMessage: ""
        };

        const modal = document.getElementById("dice-result-modal");
        modal.classList.remove("hidden");
        this.renderRollModal();
      },

      changeRollAction(newActKey) {
        this.openRollModal(newActKey);
      },

      setRollStakes(stakes) {
        const rc = this.rollContext;
        rc.stakes = stakes;
        const baseDrive = ACTION_TO_DRIVE[rc.actKey];
        const c = this.getActiveChar();
        // Reset Cunning override if leaving high stakes
        if (stakes !== "high" && rc.driveToSpend === "cunning" && baseDrive !== "cunning" && !c.selectedAbilities.includes("streetsmarts")) {
          rc.driveToSpend = baseDrive;
          rc.driveSpent = 0;
        }
        this.renderRollModal();
      },

      setRollDriveType(driveKey) {
        const rc = this.rollContext;
        rc.driveToSpend = driveKey;
        rc.driveSpent = 0;
        this.renderRollModal();
      },

      adjustRollDriveSpent(delta) {
        const rc = this.rollContext;
        const c = this.getActiveChar();
        const avail = c.drives[rc.driveToSpend]?.current || 0;
        const next = rc.driveSpent + delta;
        if (next < 0 || next > avail || next > 6) return;
        rc.driveSpent = next;
        this.renderRollModal();
      },

      adjustRollBonusDice(delta) {
        const rc = this.rollContext;
        const next = rc.bonusDice + delta;
        if (next < 0 || next > 5) return;
        rc.bonusDice = next;
        this.renderRollModal();
      },

      adjustExtraGilded(delta) {
        const rc = this.rollContext;
        const next = rc.extraGildedDice + delta;
        if (next < 0 || next > 5) return;
        rc.extraGildedDice = next;
        this.renderRollModal();
      },

      /* Renders a crisp SVG d6 face with pips */
      renderDieFaceSVG(val, isGilded, isSelected) {
        const pipCoords = {
          1: [[12, 12]],
          2: [[7, 7], [17, 17]],
          3: [[7, 7], [12, 12], [17, 17]],
          4: [[7, 7], [17, 7], [7, 17], [17, 17]],
          5: [[7, 7], [17, 7], [12, 12], [7, 17], [17, 17]],
          6: [[7, 6], [17, 6], [7, 12], [17, 12], [7, 18], [17, 18]]
        };
        const coords = pipCoords[val] || [[12, 12]];
        const pipColor = isGilded ? "#161412" : "#f3ede0";
        return `
          <svg class="w-7 h-7" viewBox="0 0 24 24">
            ${coords.map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="2.1" fill="${pipColor}"/>`).join("")}
          </svg>
        `;
      },

      /* Executes the Action Roll, deducts Drive points from character sheet, and animates dice */
      performActionRoll(isResistanceReroll = false) {
        const rc = this.rollContext;
        const c = this.getActiveChar();
        if (!c) return;
        const t = I18N[this.lang];

        const actionRating = c.actions[rc.actKey] || 0;
        let poolCount = 0;
        let isZeroRatingRoll = false;

        if (isResistanceReroll) {
          // Official Resistance Rule (Page 13): Reroll a number of dice equal to your action rating, excluding drive or assist dice.
          rc.isReroll = true;
          if (actionRating <= 0) {
            isZeroRatingRoll = true;
            poolCount = 2;
          } else {
            poolCount = Math.min(6, actionRating);
          }
        } else {
          rc.isReroll = false;
          // Deduct spent Drive points from character sheet automatically
          if (rc.driveSpent > 0) {
            const dObj = c.drives[rc.driveToSpend];
            dObj.current = Math.max(0, dObj.current - rc.driveSpent);
          }

          const driveBonusDice = rc.driveSpent > 0
            ? rc.driveSpent + (rc.firstDrivePlusTwo ? 1 : 0)
            : 0;
          const assistDice = rc.allyAssist ? 1 : 0;
          const rawTotal = actionRating + driveBonusDice + assistDice + rc.bonusDice;

          if (rawTotal <= 0) {
            // Official Zero Action Rating Rule (Page 11): Roll 2d6 and take the lowest result
            isZeroRatingRoll = true;
            poolCount = 2;
          } else {
            // Official Rule of Six (Page 11): Maximum 6 dice in a single action roll
            poolCount = Math.min(6, rawTotal);
          }
        }

        const totalGildedInPool = Math.min(
          poolCount,
          (rc.gildedOverride ? 1 : 0) + (isResistanceReroll ? 0 : rc.extraGildedDice)
        );

        const rolled = [];
        for (let i = 0; i < poolCount; i++) {
          rolled.push({
            val: Math.floor(Math.random() * 6) + 1,
            gilded: i < totalGildedInPool
          });
        }

        rc.results = rolled;
        rc.isZeroRatingRoll = isZeroRatingRoll;
        rc.gildedClaimed = false;
        rc.wellReadClaimed = false;
        rc.learnMistakesClaimed = false;
        rc.flourishUsed = false;

        // Default selection: lowest die if zero-rating roll, otherwise highest die (preferring gilded on tie)
        if (isZeroRatingRoll) {
          let minIdx = 0;
          rolled.forEach((r, idx) => {
            if (r.val < rolled[minIdx].val) minIdx = idx;
          });
          rc.selectedResultIdx = minIdx;
          // Official Zero Rating Rule: If the lowest die happens to be gilded, recover 1 drive automatically
          if (rolled[minIdx].gilded) {
            this.claimGildedDriveRecovery(true);
          }
        } else {
          let bestIdx = 0;
          rolled.forEach((r, idx) => {
            if (r.val > rolled[bestIdx].val || (r.val === rolled[bestIdx].val && r.gilded && !rolled[bestIdx].gilded)) {
              bestIdx = idx;
            }
          });
          rc.selectedResultIdx = bestIdx;
        }

        this.saveCharacters();
        if (this.currentView === "sheet") this.renderSheet();
        this.renderRollModal(true);
      },

      /* Allows player to choose between highest standard die or a Gilded die to recover +1 Drive */
      selectDieAsFinalResult(idx) {
        const rc = this.rollContext;
        if (!rc || !rc.results || rc.isZeroRatingRoll) return;
        rc.selectedResultIdx = idx;
        this.renderRollModal(false);
      },

      claimGildedDriveRecovery(silent = false) {
        const rc = this.rollContext;
        const c = this.getActiveChar();
        if (!rc || rc.gildedClaimed || !c) return;
        const chosen = rc.results[rc.selectedResultIdx];
        if (!chosen || !chosen.gilded) return;

        const baseDrive = ACTION_TO_DRIVE[rc.actKey];
        const dObj = c.drives[baseDrive];
        if (dObj.current < dObj.max) {
          dObj.current += 1;
        }
        rc.gildedClaimed = true;
        rc.statusMessage = this.lang === "pt"
          ? `+1 ${I18N.pt.drives[baseDrive].name} recuperado na ficha pelo dado dourado!`
          : `+1 ${I18N.en.drives[baseDrive].name} refreshed on sheet from gilded die!`;
        this.saveCharacters();
        if (this.currentView === "sheet") this.renderSheet();
        if (!silent) this.renderRollModal(false);
      },

      /* Burn 1 Resistance on sheet & reroll action rating dice */
      burnResistanceAndReroll() {
        const rc = this.rollContext;
        const c = this.getActiveChar();
        if (!rc || !c) return;
        const baseDrive = ACTION_TO_DRIVE[rc.actKey];
        const dObj = c.drives[baseDrive];
        const maxRes = Math.floor((dObj.max || 0) / 3);
        if (!dObj.burned) dObj.burned = [false, false, false];

        let burnedOne = false;
        for (let i = 0; i < maxRes; i++) {
          if (!dObj.burned[i]) {
            dObj.burned[i] = true;
            burnedOne = true;
            break;
          }
        }
        if (!burnedOne) return;

        rc.statusMessage = this.lang === "pt"
          ? `1 Resistência de ${I18N.pt.drives[baseDrive].name} queimada! Rerrolando valor de ação (${c.actions[rc.actKey] || 0}d6)...`
          : `1 ${I18N.en.drives[baseDrive].name} Resistance burned! Rerolling action rating (${c.actions[rc.actKey] || 0}d6)...`;
        this.performActionRoll(true);
      },

      /* Scholar Ability: Well-Read (Refund spent Intuition on 3 or less) */
      triggerWellReadRefund() {
        const rc = this.rollContext;
        const c = this.getActiveChar();
        if (!rc || rc.wellReadClaimed || rc.driveToSpend !== "intuition" || rc.driveSpent <= 0) return;
        const dObj = c.drives.intuition;
        dObj.current = Math.min(dObj.max, dObj.current + rc.driveSpent);
        rc.wellReadClaimed = true;
        rc.statusMessage = this.lang === "pt"
          ? `Leitor Ávido: +${rc.driveSpent} Intuição recuperada!`
          : `Well-Read: +${rc.driveSpent} Intuition refunded!`;
        this.saveCharacters();
        if (this.currentView === "sheet") this.renderSheet();
        this.renderRollModal(false);
      },

      /* Magician Ability: Flourish (Spend 2 Cunning to bump tier up) */
      triggerFlourishUpgrade() {
        const rc = this.rollContext;
        const c = this.getActiveChar();
        if (!rc || rc.flourishUsed || (c.drives.cunning?.current || 0) < 2) return;
        c.drives.cunning.current -= 2;
        rc.flourishUsed = true;
        rc.statusMessage = this.lang === "pt"
          ? "Prosperar ativado (-2 Astúcia): resultado elevado em 1 patamar!"
          : "Flourish activated (-2 Cunning): result pushed up one tier!";
        this.saveCharacters();
        if (this.currentView === "sheet") this.renderSheet();
        this.renderRollModal(false);
      },

      renderRollModal(animate = false) {
        const rc = this.rollContext;
        const c = this.getActiveChar();
        if (!rc || !c) return;
        const t = I18N[this.lang];
        const modal = document.getElementById("dice-result-modal");

        const baseDrive = ACTION_TO_DRIVE[rc.actKey];
        const actObj = t.drives[baseDrive].actions[rc.actKey];
        const actionRating = c.actions[rc.actKey] || 0;

        // Check character abilities that interact with dice rolls
        const hasCoolUnderPressure = c.selectedAbilities.includes("coolunderpressure");
        const hasPracticedPatter = c.selectedAbilities.includes("practicedpatter") && (rc.actKey === "sway" || rc.actKey === "hide");
        const hasStreetSmarts = c.selectedAbilities.includes("streetsmarts") && rc.actKey === "survey";
        const hasWellRead = c.selectedAbilities.includes("wellread");
        const hasFlourish = c.selectedAbilities.includes("flourish");
        const hasMeticulousNotes = c.selectedAbilities.includes("meticulousnotes") && rc.actKey === "focus" && this.getAvailableResistanceCount(c, "cunning") >= 2;
        const hasBasicTraining = c.selectedAbilities.includes("basictraining") && rc.actKey === "survey";
        const hasOpenBook = c.selectedAbilities.includes("openbook") && rc.actKey === "sway";
        const hasInterrogation = c.selectedAbilities.includes("interrogation") && rc.actKey === "read";
        const hasExtendSenses = c.selectedAbilities.includes("extendyoursenses") && rc.actKey === "sense";

        // Determine allowed Drives to spend
        const allowedDrives = [baseDrive];
        if (hasCoolUnderPressure && rc.stakes === "high" && !allowedDrives.includes("cunning")) allowedDrives.push("cunning");
        if (hasPracticedPatter && !allowedDrives.includes("intuition")) allowedDrives.push("intuition");
        if (hasStreetSmarts) {
          ["nerve", "cunning", "intuition"].forEach(d => { if (!allowedDrives.includes(d)) allowedDrives.push(d); });
        }

        const currentDriveAvail = c.drives[rc.driveToSpend]?.current || 0;
        const currentDriveMax = c.drives[rc.driveToSpend]?.max || 0;
        const availResistance = this.getAvailableResistanceCount(c, baseDrive);

        // Calculate preview pool count
        const driveDiceAdded = rc.driveSpent > 0 ? rc.driveSpent + (rc.firstDrivePlusTwo ? 1 : 0) : 0;
        const rawPool = actionRating + driveDiceAdded + (rc.allyAssist ? 1 : 0) + rc.bonusDice;
        const isZeroPreview = rawPool <= 0;
        const finalPoolPreview = isZeroPreview ? 2 : Math.min(6, rawPool);

        let resultsHtml = "";
        if (rc.results) {

          if (rc.flourishUsed) {

          }

          const tierLabels = {

            },
            full: {
              title: this.lang === "pt" ? "SUCESSO COMPLETO (6)" : "FULL SUCCESS (6)",

              color: "text-emerald-300 border-emerald-600/60 bg-emerald-950/40"
            },
            mixed: {
              title: this.lang === "pt" ? "SUCESSO PARCIAL / MISTO (4–5)" : "MIXED SUCCESS (4–5)",
              desc: this.lang === "pt" ? "Você alcança o que queria, mas há um custo ou complicação." : "You get what you wanted, but there is a cost or complication.",
              color: "text-amber-400 border-amber-600/60 bg-amber-950/30"

            miss: {

              desc: this.lang === "pt" ? "Você não alcança o que queria e a cena escala com consequências." : "You don't get what you wanted and there are consequences.",
              color: "text-red-400 border-red-700/60 bg-red-950/30"
            }
          };
          const out = tierLabels[tier];

          resultsHtml = `
            <div class="mt-3 pt-3 border-t border-stone-800 space-y-3">
              <div class="flex items-center justify-between text-[11px] text-stone-400">
                <span>${rc.isZeroRatingRoll
                  ? (this.lang === 'pt' ? 'Valor 0: 2d6 (menor resultado obrigatório)' : 'Rating 0: 2d6 (lowest result taken)')
                  : (this.lang === 'pt' ? 'Clique em um dado para escolhê-lo como resultado:' : 'Click any die to choose it as your result:')}</span>
              </div>

              <!-- Animated 3D Dice Row -->
              <div class="flex flex-wrap items-center justify-center gap-2.5 py-2">
                ${rc.results.map((r, idx) => {
                  const isSel = idx === rc.selectedResultIdx;
                  return `
                    <button onclick="app.selectDieAsFinalResult(${idx})"
                      class="${animate ? 'dice-rolling' : ''} relative p-2 rounded border-2 transition flex flex-col items-center justify-center
                        ${r.gilded ? 'bg-amber-500 text-stone-950 border-amber-200' : 'bg-stone-900 text-stone-100 border-stone-600'}
                        ${isSel ? 'ring-2 ring-amber-400 scale-110 shadow-lg' : 'opacity-75 hover:opacity-100'}">
                      ${this.renderDieFaceSVG(r.val, r.gilded, isSel)}
                      <span class="text-[10px] font-bold mt-0.5">${r.val}${r.gilded ? ' ◆' : ''}</span>
                    </button>
                  `;
                }).join("")}
              </div>

              <!-- Outcome Banner -->
              <div class="p-2.5 rounded border ${out.color}">
                <div class="font-display font-bold text-xs tracking-wider">${out.title}</div>
                <p class="text-[11px] opacity-90 mt-0.5">${out.desc}</p>
              </div>

              <!-- Gilded Die Recovery Button -->
              ${chosen.gilded && !rc.gildedClaimed ? `
                <button onclick="app.claimGildedDriveRecovery(false)"
                  class="w-full py-1.5 px-3 rounded bg-amber-600/20 hover:bg-amber-600/30 border border-amber-500 text-amber-300 text-xs font-semibold transition">
                  ◆ ${this.lang === 'pt'
                    ? `Dado Dourado Escolhido: Recuperar +1 ${t.drives[baseDrive].name} na Ficha`
                    : `Gilded Die Chosen: Refresh +1 ${t.drives[baseDrive].name} on Sheet`}
                </button>
              ` : ""}

              <!-- Post-Roll Actions: Burn Resistance / Well-Read / Flourish -->
              <div class="flex flex-wrap gap-1.5 pt-1">
                ${availResistance > 0 ? `
                  <button onclick="app.burnResistanceAndReroll()"
                    class="flex-1 py-1.5 px-2.5 rounded bg-red-950/60 hover:bg-red-900/70 border border-red-700/70 text-red-200 text-[11px] font-semibold transition">
                    ▽ ${this.lang === 'pt'
                      ? `Queimar 1 Resistência (${availResistance} disp.) → Rerrolar ${actionRating}d6`
                      : `Burn 1 Resistance (${availResistance} left) → Reroll ${actionRating}d6`}
                  </button>
                ` : ""}

                ${hasWellRead && rc.driveToSpend === "intuition" && rc.driveSpent > 0 && chosen.val <= 3 && !rc.wellReadClaimed ? `
                  <button onclick="app.triggerWellReadRefund()"
                    class="w-full py-1.5 px-2.5 rounded bg-stone-800 hover:bg-stone-700 border border-amber-600/50 text-amber-300 text-[11px] font-semibold transition">
                    ${this.lang === 'pt' ? `Leitor Ávido (3 ou menos): Recuperar +${rc.driveSpent} Intuição` : `Well-Read (3 or less): Refund +${rc.driveSpent} Intuition`}
                  </button>
                ` : ""}

                ${hasFlourish && (tier === "miss" || tier === "mixed") && (c.drives.cunning?.current || 0) >= 2 && !rc.flourishUsed ? `
                  <button onclick="app.triggerFlourishUpgrade()"
                    class="w-full py-1.5 px-2.5 rounded bg-stone-800 hover:bg-stone-700 border border-amber-600/50 text-amber-300 text-[11px] font-semibold transition">
                    ${this.lang === 'pt' ? `Prosperar: Gastar 2 Astúcia para subir resultado em 1 patamar` : `Flourish: Spend 2 Cunning to push result up one tier`}
                  </button>
                ` : ""}
              </div>

              ${rc.statusMessage ? `<p class="text-[11px] text-amber-300 italic text-center">${rc.statusMessage}</p>` : ""}
            </div>
          `;
        }

        const allActs = ["move", "strike", "control", "sway", "read", "hide", "survey", "focus", "sense"];

        modal.innerHTML = `
          <!-- Header -->
          <div class="flex items-center justify-between border-b border-stone-800 pb-2.5 mb-3">
            <div>
              <span class="font-display font-bold text-amber-400 text-sm tracking-wider block">
                ${actObj.name} — ${t.drives[baseDrive].name}
              </span>
              <span class="text-[11px] text-stone-400">${c.name || (this.lang === 'pt' ? 'Investigador' : 'Investigator')}</span>
            </div>
            <button onclick="document.getElementById('dice-result-modal').classList.add('hidden')" class="text-stone-400 hover:text-white text-base px-1">×</button>
          </div>

          <!-- Action Selector & Stakes -->
          <div class="grid grid-cols-2 gap-2 text-xs mb-3">
            <div>
              <label class="block text-[10px] uppercase tracking-wider text-stone-400 mb-1">${this.lang === 'pt' ? 'Ação' : 'Action'}</label>
